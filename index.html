<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f6b5f">
  <title>AI训练师三卷刷题</title>
  <style>
    :root {
      --bg: #f4f2eb;
      --surface: #fffdfa;
      --surface-2: #f8f6f0;
      --ink: #19231f;
      --muted: #68736e;
      --line: #dfe3dc;
      --line-strong: #c8d0c7;
      --teal: #0f6b5f;
      --teal-deep: #0a5148;
      --teal-soft: #e8f3ef;
      --amber: #d78027;
      --amber-soft: #fff2df;
      --red: #c84f3b;
      --red-soft: #fcebe7;
      --green: #2a8057;
      --green-soft: #e8f4ec;
      --focus: rgba(15, 107, 95, 0.22);
      --shadow: 0 18px 50px rgba(30, 44, 38, 0.12);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; scroll-behavior: auto; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      line-height: 1.65;
      letter-spacing: 0;
    }

    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    button:disabled { cursor: not-allowed; opacity: 0.48; }
    .icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      flex: 0 0 auto;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: -3px;
    }
    .icon-sm { width: 16px; height: 16px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-shell { min-height: 100vh; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: #f4f2eb;
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      max-width: 1480px;
      margin: 0 auto;
      min-height: 74px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .brand {
      min-width: 240px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--teal);
      box-shadow: inset 0 -6px 14px rgba(0, 0, 0, 0.12);
    }
    .brand-mark .icon { width: 23px; height: 23px; }
    .brand-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 800;
    }
    .brand-sub {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .top-center { flex: 1; display: flex; justify-content: center; }
    .paper-tabs {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }
    .paper-tab {
      border: 0;
      border-radius: 6px;
      background: transparent;
      padding: 7px 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: background 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }
    .paper-tab:hover { background: var(--surface-2); }
    .paper-tab.active {
      color: white;
      background: var(--teal);
      box-shadow: 0 3px 10px rgba(15, 107, 95, 0.2);
    }
    .top-actions {
      min-width: 240px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }
    .time-chip {
      min-width: 104px;
      height: 40px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      font-variant-numeric: tabular-nums;
      font-size: 14px;
      font-weight: 700;
    }
    .time-chip.running {
      border-color: rgba(215, 128, 39, 0.42);
      color: #a86117;
      background: var(--amber-soft);
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }
    .icon-btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
    .icon-btn:active { transform: translateY(1px); }
    .icon-btn.active { color: var(--amber); border-color: rgba(215, 128, 39, 0.45); background: var(--amber-soft); }
    .mobile-only { display: none; }

    .layout {
      width: 100%;
      max-width: 1480px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 306px minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 98px;
      max-height: calc(100vh - 122px);
      overflow: auto;
      scrollbar-width: thin;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 8px 26px rgba(36, 48, 43, 0.06);
    }
    .sidebar-section { padding: 16px; border-bottom: 1px solid var(--line); }
    .sidebar-section:last-child { border-bottom: 0; }
    .section-label {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .progress-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .progress-number { font-size: 28px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
    .progress-number em { font-style: normal; }
    .progress-number span { margin-left: 2px; color: var(--muted); font-size: 13px; font-weight: 600; }
    .progress-rate { color: var(--teal); font-size: 13px; font-weight: 800; }
    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: #e8e9e3;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--teal);
      transition: width 220ms ease;
    }
    .stat-line {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 12px;
      gap: 6px;
    }
    .stat-item { min-width: 0; }
    .stat-item strong { display: block; font-size: 15px; line-height: 1.35; font-variant-numeric: tabular-nums; }
    .stat-item span { color: var(--muted); font-size: 11px; }
    .segmented {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
    }
    .segment {
      min-height: 34px;
      padding: 5px 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .segment.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(40, 50, 45, 0.12); }
    .official-mode-note {
      padding: 10px 11px;
      border: 1px solid rgba(15, 107, 95, 0.22);
      border-radius: 8px;
      color: var(--teal-deep);
      background: var(--teal-soft);
      font-size: 12px;
      line-height: 1.7;
      font-weight: 600;
    }
    .row-gap { margin-top: 10px; }
    .search-wrap { position: relative; }
    .search-wrap .icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      padding: 0 12px 0 36px;
      color: var(--ink);
      outline: 0;
    }
    .search-input::placeholder { color: #8a938e; }
    .search-input:focus { border-color: var(--teal); background: var(--surface); box-shadow: 0 0 0 3px var(--focus); }
    .filter-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-chip {
      border: 1px solid var(--line);
      border-radius: 99px;
      background: transparent;
      padding: 5px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .filter-chip.active { color: var(--teal-deep); border-color: rgba(15, 107, 95, 0.35); background: var(--teal-soft); }
    .palette-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 10px; }
    .palette-head .section-label { margin: 0; }
    .palette-count { color: var(--muted); font-size: 11px; }
    .palette {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }
    .q-dot {
      position: relative;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
      transition: border-color 120ms ease, background 120ms ease, color 120ms ease;
      contain: layout paint;
    }
    .q-dot:hover { border-color: var(--line-strong); background: var(--surface-2); }
    .q-dot.is-answered:not(.is-correct):not(.is-wrong) { color: var(--teal-deep); border-color: rgba(15, 107, 95, 0.35); background: var(--teal-soft); }
    .q-dot.is-correct { color: var(--green); border-color: rgba(42, 128, 87, 0.4); background: var(--green-soft); }
    .q-dot.is-wrong { color: var(--red); border-color: rgba(200, 79, 59, 0.4); background: var(--red-soft); }
    .q-dot.is-current { outline: 2px solid var(--teal); outline-offset: 1px; }
    .q-dot.is-bookmarked::after {
      content: "";
      position: absolute;
      top: 4px;
      right: 4px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--amber);
    }
    .empty-palette { grid-column: 1 / -1; padding: 18px 6px; color: var(--muted); text-align: center; font-size: 13px; }
    .palette-pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .palette-pager .soft-btn { min-height: 33px; padding: 5px 7px; font-size: 11px; }
    .sidebar-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .soft-btn {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 7px 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .soft-btn:hover { background: var(--surface-2); border-color: var(--line-strong); }
    .soft-btn.danger { color: var(--red); }

    .main { min-width: 0; }
    .main-toolbar {
      min-height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .crumbs { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .crumbs strong { color: var(--ink); }
    .toolbar-actions { display: flex; align-items: center; gap: 8px; }
    .primary-btn {
      min-height: 40px;
      border: 1px solid var(--teal);
      border-radius: 8px;
      background: var(--teal);
      color: white;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 5px 14px rgba(15, 107, 95, 0.16);
    }
    .primary-btn:hover { background: var(--teal-deep); border-color: var(--teal-deep); }
    .secondary-btn {
      min-height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      padding: 8px 15px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .secondary-btn:hover { background: var(--surface-2); }
    .question-wrap { max-width: 920px; }
    .question-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .type-badge, .number-badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 800;
    }
    .type-badge { color: var(--teal-deep); background: var(--teal-soft); }
    .type-badge.multiple { color: #98570f; background: var(--amber-soft); }
    .type-badge.judge { color: #4b5f88; background: #edf0f7; }
    .number-badge { color: var(--muted); border: 1px solid var(--line); background: var(--surface); }
    .relation-badge { color: var(--amber); border-color: rgba(215, 128, 39, 0.3); background: var(--amber-soft); }
    .question-title {
      margin: 0;
      max-width: 880px;
      font-size: 27px;
      line-height: 1.48;
      font-weight: 800;
      letter-spacing: 0;
      text-wrap: pretty;
    }
    .question-note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .options { display: grid; gap: 10px; margin-top: 24px; }
    .option {
      width: 100%;
      min-height: 58px;
      padding: 13px 15px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      text-align: left;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease, box-shadow 150ms ease;
      contain: layout paint;
    }
    .option:hover:not(:disabled) { border-color: rgba(15, 107, 95, 0.48); background: #fbfdfb; box-shadow: 0 5px 16px rgba(33, 49, 42, 0.06); }
    .option:active:not(:disabled) { transform: translateY(1px); }
    .option.selected { border-color: var(--teal); background: var(--teal-soft); }
    .option.correct { border-color: rgba(42, 128, 87, 0.65); background: var(--green-soft); }
    .option.wrong { border-color: rgba(200, 79, 59, 0.65); background: var(--red-soft); }
    .option:disabled { cursor: default; opacity: 1; }
    .option-key {
      width: 29px;
      height: 29px;
      margin-top: 1px;
      border: 1.5px solid var(--line-strong);
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      background: white;
    }
    .option.multiple .option-key { border-radius: 6px; }
    .option.selected .option-key { color: white; border-color: var(--teal); background: var(--teal); }
    .option.correct .option-key { color: white; border-color: var(--green); background: var(--green); }
    .option.wrong .option-key { color: white; border-color: var(--red); background: var(--red); }
    .option-text { flex: 1; min-width: 0; padding-top: 1px; overflow-wrap: anywhere; font-size: 16px; }
    .option-state { margin-left: auto; padding-top: 2px; flex: 0 0 auto; }
    .option-state .icon { width: 20px; height: 20px; }
    .option.correct .option-state { color: var(--green); }
    .option.wrong .option-state { color: var(--red); }
    .explanation {
      margin-top: 18px;
      padding: 17px 18px;
      border-left: 4px solid var(--teal);
      background: #eef7f3;
      animation: reveal 180ms ease-out;
    }
    .explanation.is-wrong { border-left-color: var(--red); background: #fff1ed; }
    .explanation-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .explanation-title { font-size: 14px; font-weight: 800; }
    .answer-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 99px;
      color: var(--teal-deep);
      background: white;
      border: 1px solid rgba(15, 107, 95, 0.25);
      font-size: 12px;
      font-weight: 800;
    }
    .explanation.is-wrong .answer-pill { color: #923726; border-color: rgba(200, 79, 59, 0.3); }
    .knowledge-line {
      margin: 2px 0 8px;
      color: var(--teal-deep);
      font-size: 12px;
      font-weight: 700;
    }
    .explanation p { margin: 0; color: #34443d; font-size: 14px; line-height: 1.85; text-wrap: pretty; }
    @keyframes reveal { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

    .question-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    .nav-group { display: flex; align-items: center; gap: 8px; }
    .question-progress-copy { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .footer-note { max-width: 920px; margin: 32px 0 24px; color: var(--muted); font-size: 12px; }

    .mobile-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(20, 28, 24, 0.45);
    }
    .mobile-sheet {
      position: fixed;
      z-index: 80;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(88vw, 360px);
      overflow: auto;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .mobile-sheet-head {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 13px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .mobile-sheet-title { font-size: 15px; font-weight: 800; }
    .hidden { display: none !important; }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(20, 28, 24, 0.58);
    }
    .result-card {
      width: min(100%, 500px);
      max-height: calc(100vh - 36px);
      overflow: auto;
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      animation: modalIn 180ms ease-out;
    }
    @keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(0.985); } to { opacity: 1; transform: none; } }
    .result-head {
      padding: 22px 22px 17px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }
    .result-eyebrow { margin: 0 0 3px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .result-title { margin: 0; font-size: 22px; font-weight: 800; }
    .result-body { padding: 22px; }
    .score-row {
      display: flex;
      align-items: center;
      gap: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    .score-ring {
      width: 112px;
      height: 112px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: conic-gradient(var(--teal) calc(var(--score, 0) * 1%), #e8e9e3 0);
      position: relative;
    }
    .score-ring::after {
      content: "";
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      background: var(--surface);
    }
    .score-value { position: relative; z-index: 1; font-size: 32px; line-height: 1; font-weight: 900; font-variant-numeric: tabular-nums; }
    .score-value small { font-size: 12px; color: var(--muted); font-weight: 700; }
    .score-copy h3 { margin: 0 0 5px; font-size: 18px; }
    .score-copy p { margin: 0; color: var(--muted); font-size: 13px; }
    .result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 18px; }
    .result-stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--surface-2);
    }
    .result-stat span { display: block; color: var(--muted); font-size: 11px; }
    .result-stat strong { display: block; margin-top: 2px; font-size: 18px; font-variant-numeric: tabular-nums; }
    .result-actions { display: grid; gap: 8px; margin-top: 20px; }
    .result-actions-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .toast {
      position: fixed;
      z-index: 120;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 12px);
      opacity: 0;
      pointer-events: none;
      padding: 9px 14px;
      border-radius: 8px;
      color: white;
      background: #27332e;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.2);
      font-size: 13px;
      transition: opacity 160ms ease, transform 160ms ease;
      max-width: calc(100vw - 32px);
    }

    @media (max-width: 520px) {

  <script>
    const QUESTIONS = [{"id":"A001","paper":"A","number":1,"type":"single","title":"1、在自然语言处理的数据标注中，以下哪项是常见的任务类型（）。","options":[{"key":"A","text":"关键词提取"},{"key":"B","text":"文本摘要生成"},{"key":"C","text":"语义角色标注"},{"key":"D","text":"以上都是"}],"answer":["D"],"explanation":"关键词提取、文本摘要生成和语义角色标注都属于自然语言处理中的典型标注或处理任务，因此应选“以上都是”。A、B、C只是分别列举了一类任务。","source":"self-test","officialId":""},{"id":"A002","paper":"A","number":2,"type":"single","title":"2、在管理培训数据处理流程时，（  ）最有助于确保数据的安全性和隐私保护。","options":[{"key":"A","text":"数据共享协议"},{"key":"B","text":"加密技术和访问控制"},{"key":"C","text":"数据备份策略"},{"key":"D","text":"数据匿名化处理"}],"answer":["B"],"explanation":"加密可以防止数据在传输和存储中被直接读取，访问控制则限制谁能在什么条件下使用数据，两者共同覆盖数据安全与隐私保护的核心环节。共享协议、备份和匿名化各有作用，但都不如B全面。","source":"self-test","officialId":""},{"id":"A003","paper":"A","number":3,"type":"single","title":"3、如果数据集中的缺失值数量非常少，以下哪种处理方法可能是合适的（）。","options":[{"key":"A","text":"删除含缺失值的记录"},{"key":"B","text":"使用复杂的预测模型"},{"key":"C","text":"不处理缺失值"},{"key":"D","text":"增加新的数据"}],"answer":["A"],"explanation":"缺失值极少时，直接删除含缺失值的记录对样本量和数据结构影响很小，是最简单且代价较低的做法。复杂预测模型、完全不处理或盲目增加数据都不合适。","source":"self-test","officialId":"O0010"},{"id":"A004","paper":"A","number":4,"type":"single","title":"4、混淆矩阵中的真正例（TP）指的是（）。","options":[{"key":"A","text":"模型预测为正且实际为正的样本数"},{"key":"B","text":"模型预测为负且实际为负的样本数"},{"key":"C","text":"模型预测为正但实际为负的样本数"},{"key":"D","text":"模型预测为负但实际为正的样本数"}],"answer":["A"],"explanation":"TP表示预测为正类且真实标签也为正类的样本数。B对应TN，C对应FP，D对应FN，四者共同构成二分类混淆矩阵。","source":"self-test","officialId":""},{"id":"A005","paper":"A","number":5,"type":"single","title":"5、（）可能是最广泛、最普遍的一种数据标注类型。","options":[{"key":"A","text":"图像标注"},{"key":"B","text":"数字标注"},{"key":"C","text":"问号标注"},{"key":"D","text":"逗号标注"}],"answer":["A"],"explanation":"图像标注是应用最广、最常见的标注类型之一，广泛用于目标检测、语义分割和人脸识别。数字、问号和逗号并不是独立的主流标注类型。","source":"self-test","officialId":"O0011"},{"id":"A006","paper":"A","number":6,"type":"single","title":"6、在人工智能项目中，持续迭代的主要目的是（  ）。","options":[{"key":"A","text":"提高系统的计算复杂度"},{"key":"B","text":"不断改进模型性能和适应环境变化"},{"key":"C","text":"增加训练数据量"},{"key":"D","text":"设计更复杂的算法"}],"answer":["B"],"explanation":"持续迭代的价值在于根据反馈、数据变化和评估结果不断改进模型性能与业务适应性。提高复杂度、增加数据或使用更复杂算法只是可能的手段，并非迭代目的本身。","source":"self-test","officialId":""},{"id":"A007","paper":"A","number":7,"type":"single","title":"7、（  ）最常用于实现数据的分层抽样。","options":[{"key":"A","text":"随机抽样"},{"key":"B","text":"系统抽样"},{"key":"C","text":"按类别分层抽样"},{"key":"D","text":"网格搜索"}],"answer":["C"],"explanation":"分层抽样先按类别或 strata 分组，再在各层内抽样，因此能保持各类别比例。随机抽样和系统抽样本身不保证分层比例，网格搜索属于模型调参方法。","source":"self-test","officialId":"O0019"},{"id":"A008","paper":"A","number":8,"type":"single","title":"8、在3D数据标注中，以下哪项不是标注的对象（）。","options":[{"key":"A","text":"3D模型重建"},{"key":"B","text":"3D物体检测"},{"key":"C","text":"3D场景分割"},{"key":"D","text":"2D图像分类"}],"answer":["D"],"explanation":"3D标注面向三维模型、点云或三维场景，常见任务包括3D重建、3D物体检测和3D场景分割。2D图像分类属于二维视觉任务，不是3D标注对象。","source":"self-test","officialId":"O0020"},{"id":"A009","paper":"A","number":9,"type":"single","title":"9、在机器学习任务中，当数据量较大（如10万条以上）时，常用的训练集、验证集和测试集的划分比例是（  ）。","options":[{"key":"A","text":"8:1:1"},{"key":"B","text":"6:2:2"},{"key":"C","text":"7:2:1"},{"key":"D","text":"5:3:2"}],"answer":["A"],"explanation":"数据量达到十万级时，训练集通常占绝大部分，验证集和测试集各取约10%，因此8:1:1是常见划分。若数据较少，才会更常用7:2:1或6:2:2等比例。","source":"self-test","officialId":""},{"id":"A010","paper":"A","number":10,"type":"single","title":"10、在数据标注中，主标注员完成标注后，通常由谁进行质量检验（）。","options":[{"key":"A","text":"项目经理"},{"key":"B","text":"数据科学家"},{"key":"C","text":"另一位标注员"},{"key":"D","text":"自动化系统"}],"answer":["C"],"explanation":"标注质量检验通常采用交叉复核或抽样复核，由另一位标注员独立检查主标注员的结果，以降低个人偏差。项目经理、数据科学家和自动化系统可参与管理或辅助，但不是常规复核主体。","source":"self-test","officialId":""},{"id":"A011","paper":"A","number":11,"type":"single","title":"11、对于回归模型的误差度量，下列（  ）对离群值（极端值）更敏感。","options":[{"key":"A","text":"MAE（平均绝对误差）"},{"key":"B","text":"MSE（均方误差）"},{"key":"C","text":"MAPE（平均绝对百分比误差）"},{"key":"D","text":"R²（决定系数）"}],"answer":["B"],"explanation":"MSE对误差先平方再平均，极端值会产生很大的平方项，因此对离群值最敏感。MAE使用绝对值，影响相对线性；MAPE受分母影响；R²用于衡量拟合优度，不是同类误差尺度。","source":"self-test","officialId":"O0027"},{"id":"A012","paper":"A","number":12,"type":"single","title":"12、可视化的输入是（）。","options":[{"key":"A","text":"数据"},{"key":"B","text":"语言"},{"key":"C","text":"代码"},{"key":"D","text":"视觉形式"}],"answer":["A"],"explanation":"可视化流程以数据为输入，通过视觉编码生成图表等视觉形式。语言、代码和视觉形式都不是可视化的原始输入。","source":"self-test","officialId":"O0028"},{"id":"A013","paper":"A","number":13,"type":"single","title":"13、在进行优化成效验证时，（  ）指标最能反映模型在实际应用中的表现。","options":[{"key":"A","text":"训练误差"},{"key":"B","text":"测试准确率"},{"key":"C","text":"精度与召回率"},{"key":"D","text":"收敛速度"}],"answer":["C"],"explanation":"实际应用更关注模型能否既找到目标又减少误报，因此精度与召回率的组合最有参考价值。训练误差不能代表泛化；单一测试准确率在类别不平衡时可能失真；收敛速度只说明训练过程。","source":"self-test","officialId":""},{"id":"A014","paper":"A","number":14,"type":"single","title":"14、在算法模型测试中，召回率（Recall）通常用来衡量什么（）。","options":[{"key":"A","text":"模型预测为正类的样本中，实际为正类的比例"},{"key":"B","text":"所有实际为正类的样本中，模型预测为正类的比例"},{"key":"C","text":"模型预测为负类的样本中，实际为负类的比例"},{"key":"D","text":"所有实际为负类的样本中，模型预测为负类的比例"}],"answer":["B"],"explanation":"召回率Recall=TP/(TP+FN)，分母是所有真实正类，表示正类样本被模型找回的比例。A描述的是精确率Precision，C、D描述的是负类相关比例。","source":"self-test","officialId":""},{"id":"A015","paper":"A","number":15,"type":"single","title":"15、根据数据源的数量以及缺失、不一致或者冗余情况，决定（）和清洗步骤。","options":[{"key":"A","text":"数据转换"},{"key":"B","text":"数据查看"},{"key":"C","text":"数据查阅"},{"key":"D","text":"数据观察"}],"answer":["A"],"explanation":"官方题库对应题给出的答案是“数据转换”。本题强调根据数据源数量以及缺失、不一致或冗余情况，决定后续的数据转换与清洗步骤；数据查看、查阅、观察都只是发现问题的过程，不能替代后续处理决策。","source":"self-test","officialId":"O0042"},{"id":"A016","paper":"A","number":16,"type":"single","title":"16、数据分析中，主成分分析（PCA）主要用于（）。","options":[{"key":"A","text":"数据压缩"},{"key":"B","text":"数据去重"},{"key":"C","text":"数据加密"},{"key":"D","text":"数据备份"}],"answer":["A"],"explanation":"PCA通过线性变换把原始变量映射到少数主成分上，在尽量保留方差的同时降低维度，可视为有损数据压缩。它不是去重、加密或备份技术。","source":"self-test","officialId":"O0045"},{"id":"A017","paper":"A","number":17,"type":"single","title":"17、如果对某一参数构建了95%的置信区间，那么该解释通常是（  ）。","options":[{"key":"A","text":"真值有95%的概率落在这个区间内"},{"key":"B","text":"如果重复无数次相同实验，每次计算区间，其中约95%的此类区间将包含真值"},{"key":"C","text":"样本均值有95%的概率出现在区间内"},{"key":"D","text":"区间两端点都有95%的概率为正确值"}],"answer":["B"],"explanation":"置信区间的频率学派含义是：在相同条件下重复抽样并每次构造区间，长期约有95%的区间会覆盖真实参数。参数本身是固定值，不能表述为“有95%概率落在已经算出的这个区间内”。","source":"self-test","officialId":""},{"id":"A018","paper":"A","number":18,"type":"single","title":"18、数据采集质量直接影响到数据的哪个方面（）。","options":[{"key":"A","text":"可用性"},{"key":"B","text":"处理速度"},{"key":"C","text":"存储成本"},{"key":"D","text":"数据类型"}],"answer":["A"],"explanation":"采集质量决定了数据能否真实、完整地支持后续分析，因此首先影响数据可用性。处理速度、存储成本或数据类型可能间接受到影响，但不是采集质量最直接的结果。","source":"self-test","officialId":""},{"id":"A019","paper":"A","number":19,"type":"single","title":"19、职工道德修养对个人职业生涯的影响主要体现在（）。","options":[{"key":"A","text":"增加跳槽机会"},{"key":"B","text":"减少工作满意度"},{"key":"C","text":"提升职业形象"},{"key":"D","text":"降低工作效率"}],"answer":["C"],"explanation":"良好的职业道德会提升个人的可信度、责任感和专业形象，从而增强职业竞争力。增加跳槽机会、降低效率或降低满意度都不符合职业道德的正向作用。","source":"self-test","officialId":"O0061"},{"id":"A020","paper":"A","number":20,"type":"single","title":"20、关于语音技术，下面不正确的说法是（)。","options":[{"key":"A","text":"语音合成是将文字信息转变为语音效据"},{"key":"B","text":"语音技术就是多媒体技术"},{"key":"C","text":"语音技术中的关键是语音识别和语音合成"},{"key":"D","text":"语音识别是使计算机能识别人说的话"}],"answer":["B"],"explanation":"语音技术包含识别、合成等专门方向，并不等同于多媒体技术。A、C、D的表述基本正确，因此不正确的是B。","source":"self-test","officialId":""},{"id":"A021","paper":"A","number":21,"type":"single","title":"21、数据标注规则的指定主要是为了实现什么目标（）。","options":[{"key":"A","text":"提高标注效率"},{"key":"B","text":"确保标注结果的一致性和准确性"},{"key":"C","text":"减少数据集的大小"},{"key":"D","text":"增加标注人员的自由裁量权"}],"answer":["B"],"explanation":"标注规则的核心作用是统一判断口径，使不同人员对同类样本得到一致且准确的结果。效率可能提高，但这是附带效果；规则不会以减少数据量为目标。","source":"self-test","officialId":""},{"id":"A022","paper":"A","number":22,"type":"single","title":"22、数据标注质量检验的首要目的是（）。","options":[{"key":"A","text":"提高标注速度"},{"key":"B","text":"降低标注成本"},{"key":"C","text":"确保标注准确性"},{"key":"D","text":"提升标注工具性能"}],"answer":["C"],"explanation":"质量检验首先要确认标注结果是否准确、是否符合规则；提高速度、降低成本或优化工具都是管理或技术目标。准确性不过关时，其他指标没有意义。","source":"self-test","officialId":"O0074"},{"id":"A023","paper":"A","number":23,"type":"single","title":"23、在设计人工智能业务模块时，（  ）是首要任务。","options":[{"key":"A","text":"数据预处理"},{"key":"B","text":"模型选择"},{"key":"C","text":"系统部署"},{"key":"D","text":"需求分析"}],"answer":["D"],"explanation":"设计AI业务模块应先明确业务问题、目标、约束和验收标准，即需求分析，再决定数据、模型和部署方案。脱离需求直接做预处理或选模型容易方向错误。","source":"self-test","officialId":""},{"id":"A024","paper":"A","number":24,"type":"single","title":"24、在深度学习中，批量归一化（Batch Normalization）的主要作用是什么（）。","options":[{"key":"A","text":"减少模型的过拟合"},{"key":"B","text":"加速模型的收敛"},{"key":"C","text":"减少模型的泛化能力"},{"key":"D","text":"增加模型的复杂度"}],"answer":["B"],"explanation":"批量归一化通过稳定各层输入分布，使网络可以使用更大的学习率并加快收敛，同时具有一定正则效果。题目问主要作用，加速收敛比“减少过拟合”更直接；它不会降低泛化能力。","source":"self-test","officialId":""},{"id":"A025","paper":"A","number":25,"type":"single","title":"25、在机器学习模型的参数调优过程中，最常用的调优方法是（  ）。","options":[{"key":"A","text":"网格搜索"},{"key":"B","text":"随机搜索"},{"key":"C","text":"梯度下降"},{"key":"D","text":"正则化"}],"answer":["A"],"explanation":"网格搜索会系统枚举候选超参数组合，是传统模型调参中最常用的方法。随机搜索也是调参方法但并非“最常用”；梯度下降训练参数，正则化用于约束模型。","source":"self-test","officialId":"O0085"},{"id":"A026","paper":"A","number":26,"type":"single","title":"26、数据清洗中，数据类型转换通常是为了（）。","options":[{"key":"A","text":"增加数据的复杂性"},{"key":"B","text":"减少数据的一致性"},{"key":"C","text":"提高数据的兼容性"},{"key":"D","text":"降低数据的准确性"}],"answer":["C"],"explanation":"类型转换把不同来源的数据统一为可比较、可计算或可入库的类型，从而提高兼容性。它不会以增加复杂性或降低准确性为目标。","source":"self-test","officialId":"O0087"},{"id":"A027","paper":"A","number":27,"type":"single","title":"27、在降维中，t-SNE最适合处理（  ）。","options":[{"key":"A","text":"线性可分的数据"},{"key":"B","text":"非线性高维数据的可视化"},{"key":"C","text":"二维结构数据"},{"key":"D","text":"时间序列数据"}],"answer":["B"],"explanation":"t-SNE擅长在二维或三维中展示高维数据的局部邻域结构，尤其适合非线性高维数据的可视化。它不用于线性可分性证明，也不是专门的时间序列方法。","source":"self-test","officialId":"O0088"},{"id":"A028","paper":"A","number":28,"type":"single","title":"28、在Internet中，用字符串表示的IP地址称为（）。","options":[{"key":"A","text":"账户"},{"key":"B","text":"域名"},{"key":"C","text":"主机名"},{"key":"D","text":"用户名"}],"answer":["B"],"explanation":"用便于记忆的字符串表示IP地址的形式称为域名，例如 www.example.com。IP地址是数值地址，域名通过DNS解析为IP地址。","source":"self-test","officialId":"O0090"},{"id":"A029","paper":"A","number":29,"type":"single","title":"29、在特征选择中，使用主成分分析（PCA）的主要目的是什么（）。","options":[{"key":"A","text":"降维"},{"key":"B","text":"去噪"},{"key":"C","text":"特征编码"},{"key":"D","text":"特征选择"}],"answer":["A"],"explanation":"PCA将多个相关特征转换为少数互不相关的主成分，主要目标是降维并保留主要方差。它属于特征提取而非特征选择，也不以去噪或编码为主要目的。","source":"self-test","officialId":""},{"id":"A030","paper":"A","number":30,"type":"single","title":"30、在数据去重中，如果数据集中的记录部分信息相同，以下哪种方法可能更有效（）。","options":[{"key":"A","text":"基于哈希的方法"},{"key":"B","text":"基于规则的方法"},{"key":"C","text":"基于聚类的方法"},{"key":"D","text":"基于排序的方法"}],"answer":["C"],"explanation":"部分信息相同意味着记录只能按相似度判断是否重复，聚类可以把相似记录聚合到同一簇后再比对，比完全相等的哈希或简单规则更灵活。排序本身不能识别相似记录。","source":"self-test","officialId":""},{"id":"A031","paper":"A","number":31,"type":"single","title":"31、算法优化的主要目标是提高算法的（）。","options":[{"key":"A","text":"可读性"},{"key":"B","text":"可扩展性"},{"key":"C","text":"执行效率"},{"key":"D","text":"用户交互性"}],"answer":["C"],"explanation":"算法优化的直接目标通常是降低时间或空间开销，提高执行效率。可读性、可扩展性和交互性也重要，但不是“算法优化”最核心的目标。","source":"self-test","officialId":"O0104"},{"id":"A032","paper":"A","number":32,"type":"single","title":"32、在进行数据采集系统的日常维护时，以下哪项操作是不必要的（）。","options":[{"key":"A","text":"检查数据采集硬件的连接状态"},{"key":"B","text":"更新数据采集软件的版本"},{"key":"C","text":"定期清理存储设备上的数据"},{"key":"D","text":"重新启动数据采集系统"}],"answer":["D"],"explanation":"硬件连接、软件更新和存储清理都属于日常维护；重启系统只在故障恢复或更新需要时进行，不应作为不必要的例行操作。","source":"self-test","officialId":""},{"id":"A033","paper":"A","number":33,"type":"single","title":"33、如果数据集中的缺失值分布是随机的，以下哪种处理方法可能是合适的（）。","options":[{"key":"A","text":"删除所有缺失值"},{"key":"B","text":"用列的均值填充数值型数据"},{"key":"C","text":"删除含有缺失值的整个特征"},{"key":"D","text":"用其他变量预测缺失值"}],"answer":["B"],"explanation":"缺失值完全随机时，用该列均值等统计量填充不会系统性偏向某一类样本，是常用做法。删除全部缺失值或整列会浪费信息，预测填充成本更高且并非首选。","source":"self-test","officialId":"O0124"},{"id":"A034","paper":"A","number":34,"type":"single","title":"34、词袋模型在文本处理中主要用来做什么（）。","options":[{"key":"A","text":"将文本转换为词频向量"},{"key":"B","text":"识别文本中的关键词"},{"key":"C","text":"计算文档之间的相似度"},{"key":"D","text":"进行文本的情感分析"}],"answer":["A"],"explanation":"词袋模型统计词在文档中的出现次数或频次，把文本转换成固定维度的词频向量。关键词识别、相似度和情感分析可基于该向量继续实现，但不是词袋模型本身的主要功能。","source":"self-test","officialId":""},{"id":"A035","paper":"A","number":35,"type":"single","title":"35、在混合模式标注项目中，以下哪项措施最有助于减少人工标注员的重复劳动（）。","options":[{"key":"A","text":"提高标注员的培训频率"},{"key":"B","text":"增加标注项目的预算"},{"key":"C","text":"引入自动化预标注工具"},{"key":"D","text":"扩大标注团队的规模"}],"answer":["C"],"explanation":"自动化预标注先生成候选框、标签或转写结果，人工只需审核和修正，能显著减少重复劳动。培训、预算和扩员可以缓解问题，但不能直接消除重复操作。","source":"self-test","officialId":"O0150"},{"id":"A036","paper":"A","number":36,"type":"single","title":"36、数据标注员需要遵循的工作原则不包括（）。","options":[{"key":"A","text":"理解任务要求"},{"key":"B","text":"保持主观性"},{"key":"C","text":"统一标准规范"},{"key":"D","text":"保护数据隐私"}],"answer":["B"],"explanation":"标注工作要求客观、统一并保护隐私，不能由标注员凭主观喜好随意判断。理解任务、统一规范和保护数据都是必须遵守的原则。","source":"self-test","officialId":"O0152"},{"id":"A037","paper":"A","number":37,"type":"single","title":"37、（）是指将聚类结果与外部某个参考模型进行比较。","options":[{"key":"A","text":"外部指标"},{"key":"B","text":"图像指标"},{"key":"C","text":"语音指标"},{"key":"D","text":"文本指标"}],"answer":["A"],"explanation":"将聚类结果与外部参考标签或标准模型比较的评价方式称为外部指标，如纯度、兰德指数。内部指标只利用聚类结果和样本自身结构。","source":"self-test","officialId":""},{"id":"A038","paper":"A","number":38,"type":"single","title":"38、在数据分析中，相关性分析用于（）。","options":[{"key":"A","text":"评估变量之间的因果关系"},{"key":"B","text":"确定变量的类型"},{"key":"C","text":"预测数据点的值"},{"key":"D","text":"计算数据的分布"}],"answer":["A"],"explanation":"相关性分析用于判断变量之间相关方向与强弱，是探索关联关系的重要手段，但相关不等于因果。B、C、D分别属于类型识别、预测和分布统计，不是相关性分析的核心定义。","source":"self-test","officialId":""},{"id":"A039","paper":"A","number":39,"type":"single","title":"39、在机器学习中，使用K折交叉验证的主要目的是什么（）。","options":[{"key":"A","text":"增加数据集的大小"},{"key":"B","text":"减少模型的方差"},{"key":"C","text":"提高模型的准确度"},{"key":"D","text":"减少计算时间"}],"answer":["B"],"explanation":"K折交叉验证让每个样本轮流进入验证集，用多折结果平均来降低单次划分带来的波动，使性能估计更稳定。它不会扩大数据集，通常还会增加计算时间。","source":"self-test","officialId":""},{"id":"A040","paper":"A","number":40,"type":"single","title":"40、在团队管理中，以下哪项措施最能有效激发团队成员的积极性和忠诚度（）。","options":[{"key":"A","text":"仅在团队达成重大里程碑时给予奖励"},{"key":"B","text":"忽视团队成员的个人职业发展需求"},{"key":"C","text":"定期组织团队建设活动，增强团队精神"},{"key":"D","text":"只关注任务完成，不关心团队成员的个人感受"}],"answer":["C"],"explanation":"定期团队建设能改善沟通、信任和归属感，比只在重大节点奖励或忽视个人发展更能持续激发积极性。有效管理还应结合公平激励和个人成长。","source":"self-test","officialId":"O0210"},{"id":"A041","paper":"A","number":41,"type":"single","title":"41、在数据预处理中，处理缺失值的一种常见方法是（）。","options":[{"key":"A","text":"删除含有缺失值的行或列"},{"key":"B","text":"用固定值填充所有缺失值"},{"key":"C","text":"用统计值（如均值、中位数）填充"},{"key":"D","text":"忽略缺失值"}],"answer":["C"],"explanation":"用均值、中位数或众数等统计量填充缺失值是数据预处理中的常见方法，能保留样本数量。A也有适用场景，但“删除”会损失信息；固定值和直接忽略通常不推荐。","source":"self-test","officialId":""},{"id":"A042","paper":"A","number":42,"type":"single","title":"42、语音识别系统的模型通常由（）和语言模型两部分组成。","options":[{"key":"A","text":"声学模型"},{"key":"B","text":"声纹模型"},{"key":"C","text":"声调模型"},{"key":"D","text":"声色模型"}],"answer":["A"],"explanation":"传统语音识别系统通常由声学模型和语言模型组成：前者把声音特征映射为音素或字符，后者约束词序列的合理性。声纹、声调和声色不是该框架的两大组成。","source":"self-test","officialId":"O0237"},{"id":"A043","paper":"A","number":43,"type":"single","title":"43、在培训数据处理流程中，（  ）是确保数据准确性和一致性的关键步骤。","options":[{"key":"A","text":"数据清洗"},{"key":"B","text":"数据输入"},{"key":"C","text":"数据存储"},{"key":"D","text":"数据分析"}],"answer":["A"],"explanation":"数据清洗负责发现并修正缺失、重复、异常和格式不一致等问题，是保证准确性和一致性的关键。输入、存储和分析都依赖清洗后的数据质量。","source":"self-test","officialId":"O0238"},{"id":"A044","paper":"A","number":44,"type":"single","title":"44、在分类问题中，查准率（查全率）和查全率（召回率）之间通常存在什么关系?","options":[{"key":"A","text":"它们是相同的指标"},{"key":"B","text":"它们是互斥的指标"},{"key":"C","text":"它们之间存在权衡关系"},{"key":"D","text":"它们之间没有关系"}],"answer":["C"],"explanation":"提高查准率通常会减少预测为正类的数量，可能导致查全率下降，二者一般存在权衡。实际应用常通过F1值、PR曲线或业务代价综合选择阈值。","source":"self-test","officialId":""},{"id":"A045","paper":"A","number":45,"type":"single","title":"45、在数据分析领域，主成分分析（PCA）技术通常用于实现以下哪个目标（）。","options":[{"key":"A","text":"识别数据集中的异常值"},{"key":"B","text":"通过正则化方法提高模型的泛化能力"},{"key":"C","text":"降低数据的维度同时保留关键信息"},{"key":"D","text":"构建分类器以提高分类精度"}],"answer":["C"],"explanation":"PCA通过正交变换提取少数主成分，在降维的同时尽可能保留原始数据的方差信息。它不是异常检测、正则化或分类器。","source":"self-test","officialId":""},{"id":"A046","paper":"A","number":46,"type":"single","title":"46、在算法模型测试中，K折交叉验证通常用于（）。","options":[{"key":"A","text":"快速评估模型性能"},{"key":"B","text":"减少数据使用量"},{"key":"C","text":"增加模型复杂度"},{"key":"D","text":"减少计算资源消耗"}],"answer":["A"],"explanation":"K折交叉验证用多折训练和验证结果估计模型性能，适合在小样本下较稳定地评估泛化能力。它会增加训练次数，并不减少数据使用或计算资源。","source":"self-test","officialId":""},{"id":"A047","paper":"A","number":47,"type":"single","title":"47、特征选择中的包装方法通常依赖于什么（）。","options":[{"key":"A","text":"数据集的大小"},{"key":"B","text":"模型的性能"},{"key":"C","text":"特征的数量"},{"key":"D","text":"特征的类型"}],"answer":["B"],"explanation":"包装法把特征子集的选择交给具体学习器，根据模型在验证集上的性能来评价子集好坏，因此依赖模型性能。过滤法才主要依据统计指标，嵌入法把选择融入训练。","source":"self-test","officialId":"O0271"},{"id":"A048","paper":"A","number":48,"type":"single","title":"48、以下哪个领域不会对人机交互学科产生影响（）。","options":[{"key":"A","text":"计算机科学"},{"key":"B","text":"人因功效学"},{"key":"C","text":"认知心理学"},{"key":"D","text":"上述学科均对人机交互学科有影响"}],"answer":["D"],"explanation":"人机交互是交叉学科，计算机科学提供实现技术，人因功效学关注人体能力与工作负荷，认知心理学解释感知、记忆和决策过程，三者都会产生影响。","source":"self-test","officialId":""},{"id":"A049","paper":"A","number":49,"type":"single","title":"49、可视化的输出是（）。","options":[{"key":"A","text":"数据"},{"key":"B","text":"代码"},{"key":"C","text":"视觉形式"},{"key":"D","text":"语言"}],"answer":["C"],"explanation":"可视化把数据编码为图形、颜色、位置等视觉形式，因此输出是视觉呈现。数据是输入，代码是工具，语言不是可视化的标准输出。","source":"self-test","officialId":"O0272"},{"id":"A050","paper":"A","number":50,"type":"single","title":"50、数据清洗的主要目的是什么（）。","options":[{"key":"A","text":"增加数据量"},{"key":"B","text":"提高数据质量"},{"key":"C","text":"减少存储空间"},{"key":"D","text":"降低处理速度"}],"answer":["B"],"explanation":"数据清洗通过处理缺失、重复、异常和不一致问题来提高数据质量，从源头改善分析结果。增加数据量、压缩存储或降低速度都不是其主要目的。","source":"self-test","officialId":""},{"id":"A051","paper":"A","number":51,"type":"single","title":"51、文本标注中的词性标注是指（）。","options":[{"key":"A","text":"标注文本中每个词的语法类别"},{"key":"B","text":"标注文本中每个词的语义"},{"key":"C","text":"标注文本中每个词的发音"},{"key":"D","text":"标注文本中每个词的词性"}],"answer":["A"],"explanation":"词性标注是为文本中的每个词确定名词、动词、形容词等语法类别。B描述语义标注，C描述发音标注，D与A含义接近但A更完整地说明“语法类别”这一核心。","source":"self-test","officialId":"O0285"},{"id":"A052","paper":"A","number":52,"type":"single","title":"52、在MicrosoftExcel中，（  ）可以快速统计某列的总和。","options":[{"key":"A","text":"数据透视表"},{"key":"B","text":"筛选"},{"key":"C","text":"自动求和"},{"key":"D","text":"插入图表"}],"answer":["C"],"explanation":"Excel的“自动求和”可对选中列或相邻区域快速求和。数据透视表用于汇总分析，筛选用于筛选记录，插入图表用于可视化。","source":"self-test","officialId":""},{"id":"A053","paper":"A","number":53,"type":"single","title":"53、在AI数据处理流程中，数据提取组件的主要作用是什么?","options":[{"key":"A","text":"清洗数据"},{"key":"B","text":"转换数据格式"},{"key":"C","text":"从源系统中提取数据"},{"key":"D","text":"加载数据到目标系统"}],"answer":["C"],"explanation":"ETL中的Extract即数据提取，任务是从业务库、文件、接口等源系统读取原始数据。清洗、格式转换和加载分别属于后续处理环节。","source":"self-test","officialId":"O0309"},{"id":"A054","paper":"A","number":54,"type":"single","title":"54、在机器学习中，标注数据的主要作用不包括以下哪项（）。","options":[{"key":"A","text":"提供模型训练的目标"},{"key":"B","text":"加速模型的训练过程"},{"key":"C","text":"限制模型的应用场景"},{"key":"D","text":"增强模型的预测能力"}],"answer":["C"],"explanation":"标注数据为监督学习提供目标标签，能增强模型学习正确映射的能力，并可能影响训练效率；但它不会以“限制模型应用场景”为目的。限制场景是部署或合规约束。","source":"self-test","officialId":""},{"id":"A055","paper":"A","number":55,"type":"single","title":"55、在算法测试中，交叉验证的主要作用是（）。","options":[{"key":"A","text":"减少计算成本"},{"key":"B","text":"提高算法泛化能力"},{"key":"C","text":"增加训练数据"},{"key":"D","text":"减少过拟合风险"}],"answer":["D"],"explanation":"官方题库对应题的答案是“减少过拟合风险”。交叉验证通过多折验证检查模型稳定性，并帮助选择更稳健的模型或参数；按本卷题库口径，D为正确项。","source":"self-test","officialId":"O0330"},{"id":"A056","paper":"A","number":56,"type":"single","title":"56、在视频标注中，关键帧标注的主要作用是（）。","options":[{"key":"A","text":"减少存储空间"},{"key":"B","text":"提高视频理解的准确性"},{"key":"C","text":"降低视频播放速度"},{"key":"D","text":"增加视频的分辨率"}],"answer":["B"],"explanation":"关键帧标注选取视频中有代表性的帧，帮助模型抓住物体、动作和场景变化，从而提高视频理解准确性。它不直接减少存储、改变播放速度或提高分辨率。","source":"self-test","officialId":""},{"id":"A057","paper":"A","number":57,"type":"single","title":"57、数据采集，又称（），是利用一种装置，从系统外部采集数据并输入到系统内部的一个接口。","options":[{"key":"A","text":"数据收集"},{"key":"B","text":"数据搜集"},{"key":"C","text":"数据获取"},{"key":"D","text":"数据汇集"}],"answer":["C"],"explanation":"数据采集也常称为数据获取，强调通过传感器、接口或软件装置取得外部数据。收集、搜集和汇集更偏日常语义，不是该定义中的标准术语。","source":"self-test","officialId":""},{"id":"A058","paper":"A","number":58,"type":"single","title":"58、业务流程优化中，以下哪项不是衡量流程改进效果的关键指标（）。","options":[{"key":"A","text":"流程周期时间"},{"key":"B","text":"客户投诉率"},{"key":"C","text":"员工满意度"},{"key":"D","text":"流程设计美观度"}],"answer":["D"],"explanation":"流程周期、客户投诉率和员工满意度都能反映流程效率或效果；流程设计美观度属于呈现形式，不是衡量业务改进价值的关键绩效指标。","source":"self-test","officialId":"O0358"},{"id":"A059","paper":"A","number":59,"type":"single","title":"59、在AI数据处理流程中，“数据提取”阶段的主要任务是什么?","options":[{"key":"A","text":"清洗数据"},{"key":"B","text":"转换数据格式"},{"key":"C","text":"从源系统中提取数据"},{"key":"D","text":"加载数据到目标数据库"}],"answer":["C"],"explanation":"数据提取阶段负责从源系统获取原始数据，为后续清洗、转换和加载提供输入。A对应清洗，B对应转换，D对应加载。","source":"self-test","officialId":""},{"id":"A060","paper":"A","number":60,"type":"single","title":"60、在可行性验证的初始阶段，通常应先进行（  ）。","options":[{"key":"A","text":"大规模上线部署"},{"key":"B","text":"立即投入全量生产环境"},{"key":"C","text":"简单的概念验证（ProofofConcept）或小规模试点测试"},{"key":"D","text":"无需验证，直接信任方案设计"}],"answer":["C"],"explanation":"可行性验证应先通过概念验证或小规模试点，以较低成本检验技术路线和业务价值，再决定是否扩大。直接大规模上线或全量生产会放大风险。","source":"self-test","officialId":"O0470"},{"id":"A061","paper":"A","number":61,"type":"multiple","title":"61、在大数据采集中，以下哪些措施可以提高数据质量（）。【多选题】","options":[{"key":"A","text":"使用数据校验机制"},{"key":"B","text":"限制数据来源"},{"key":"C","text":"实施数据监控"},{"key":"D","text":"定期进行数据审核"}],"answer":["A","C","D"],"explanation":"校验机制能在入库前发现错误，监控能及时发现异常，定期审核能纠正长期积累的问题，三者都能提高数据质量。单纯限制来源可能造成覆盖偏差，并不能保证质量。","source":"self-test","officialId":""},{"id":"A062","paper":"A","number":62,"type":"multiple","title":"62、在数据标注质量检验领域，以下哪些方法可以用于评估标注的质量（）。【多选题】","options":[{"key":"A","text":"交叉验证"},{"key":"B","text":"一致性检验"},{"key":"C","text":"错误率分析"},{"key":"D","text":"标注结果的统计分析"}],"answer":["A","B","C","D"],"explanation":"交叉复核、一致性检验、错误率分析和统计分析都能从不同角度评价标注质量：前者检查偏差，后三者分别衡量一致性、错误水平和分布特征。","source":"self-test","officialId":"O0862"},{"id":"A063","paper":"A","number":63,"type":"multiple","title":"63、以下哪些措施有助于提高数据标注规则的执行效率（）。【多选题】","options":[{"key":"A","text":"提供详细的规则说明"},{"key":"B","text":"进行规则培训"},{"key":"C","text":"实施规则审核机制"},{"key":"D","text":"增加标注任务的报酬"}],"answer":["A","B","C"],"explanation":"清晰说明、培训和审核机制能降低理解偏差并形成闭环，直接提升规则执行效率。增加报酬可能改善积极性，但不是提高规则执行效率的直接方法。","source":"self-test","officialId":""},{"id":"A064","paper":"A","number":64,"type":"multiple","title":"64、在指定数据标注规则时，以下哪些因素是重要的（）。【多选题】","options":[{"key":"A","text":"确保规则的可理解性"},{"key":"B","text":"规则应覆盖所有可能的数据情况"},{"key":"C","text":"规则应具有一定的灵活性"},{"key":"D","text":"规则应简洁明了，避免冗长"}],"answer":["A","C","D"],"explanation":"规则要让标注员容易理解，并保留处理边界案例的合理弹性，同时尽量简洁以避免歧义。要求覆盖“所有可能情况”既不现实，也会使规则过度冗长。","source":"self-test","officialId":"O0886"},{"id":"A065","paper":"A","number":65,"type":"multiple","title":"65、在数据预处理中，以下哪些技术是常用的（）。【多选题】","options":[{"key":"A","text":"数据归一化"},{"key":"B","text":"数据标准化"},{"key":"C","text":"特征选择"},{"key":"D","text":"数据丢失"}],"answer":["A","B","C"],"explanation":"归一化、标准化和特征选择都是常见预处理或特征处理技术。数据丢失是数据质量问题或错误结果，不是预处理技术。","source":"self-test","officialId":""},{"id":"A066","paper":"A","number":66,"type":"multiple","title":"66、数据变换可以包括以下哪些方法?【多选题】","options":[{"key":"A","text":"标准化"},{"key":"B","text":"对数变换"},{"key":"C","text":"离散化"},{"key":"D","text":"主成分分析"}],"answer":["A","B","C","D"],"explanation":"标准化改变尺度，对数变换调整分布形态，离散化把连续值转为区间，PCA可生成新的低维特征，这些都属于数据变换的常见方法。","source":"self-test","officialId":"O0910"},{"id":"A067","paper":"A","number":67,"type":"multiple","title":"67、对于需要模型在特征空间中直接度量样本间相似度或距离的任务（如度量学习和人脸识别），下列（  ）损失函数往往更适合。【多选题】","options":[{"key":"A","text":"HingeLoss"},{"key":"B","text":"TripletLoss"},{"key":"C","text":"ContrastiveLoss"},{"key":"D","text":"L2Loss（MSE）"}],"answer":["B","C"],"explanation":"Triplet Loss通过锚点、正样本和负样本的相对距离学习嵌入，Contrastive Loss约束相似样本靠近、不相似样本远离，适合度量学习。Hinge Loss多用于分类间隔，MSE不是距离度量学习的首选。","source":"self-test","officialId":""},{"id":"A068","paper":"A","number":68,"type":"multiple","title":"68、为了确保数据采集的完整性，可以采取以下哪些措施（）。【多选题】","options":[{"key":"A","text":"增加数据采集点"},{"key":"B","text":"实施数据采集监控"},{"key":"C","text":"使用自动化采集系统"},{"key":"D","text":"减少人为干预"}],"answer":["A","B","C","D"],"explanation":"增加采集点可扩大覆盖，监控能发现中断或遗漏，自动化减少人为遗漏，减少不必要的人工干预还能降低操作错误，四者都有助于提高完整性。","source":"self-test","officialId":"O0927"},{"id":"A069","paper":"A","number":69,"type":"multiple","title":"69、数据采集过程中的异常处理包括哪些方面（）。【多选题】","options":[{"key":"A","text":"识别异常数据"},{"key":"B","text":"记录异常情况"},{"key":"C","text":"采取纠正措施"},{"key":"D","text":"忽略异常数据"}],"answer":["A","B","C"],"explanation":"异常处理应形成识别、记录和纠正的闭环。忽略异常会让错误数据进入后续流程，不能作为处理措施。","source":"self-test","officialId":""},{"id":"A070","paper":"A","number":70,"type":"multiple","title":"70、划分数据集时，以下（  ）因素需要考虑。【多选题】","options":[{"key":"A","text":"数据量的大小"},{"key":"B","text":"数据分布的平衡性"},{"key":"C","text":"模型的复杂度"},{"key":"D","text":"硬件的计算能力"}],"answer":["A","B","C"],"explanation":"官方题库对应题将数据量、数据分布平衡性和模型复杂度都列为划分数据集时需要考虑的因素。模型越复杂，通常越需要足够的验证和测试数据；硬件能力不是划分数据集的核心依据。","source":"self-test","officialId":"O0944"},{"id":"A071","paper":"A","number":71,"type":"judge","title":"71、数据清洗内容包括缺失值处理、异常值处理、去重处理和噪音数据处理。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["A"],"explanation":"缺失值、异常值、重复值和噪声都是影响数据质量的典型问题，属于数据清洗的核心内容。","source":"self-test","officialId":""},{"id":"A072","paper":"A","number":72,"type":"judge","title":"72、在大数据环境下，使用列式存储可以提高查询性能，特别是在处理大型分析查询时。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["A"],"explanation":"列式存储只读取查询涉及的列，避免扫描整行，特别适合大规模聚合和分析查询，因此通常能提升查询性能。","source":"self-test","officialId":""},{"id":"A073","paper":"A","number":73,"type":"judge","title":"73、在高并发压力测试中，如果请求数增加导致响应时间显著上升并出现超时，说明系统存在性能瓶颈，需要进行优化。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["A"],"explanation":"并发请求增加后响应时间显著上升并超时，说明吞吐量或资源能力已接近瓶颈。需要通过压测定位CPU、内存、I/O或锁竞争等问题后优化。","source":"self-test","officialId":"O1126"},{"id":"A074","paper":"A","number":74,"type":"judge","title":"74、大数据技术可以实时处理数据流","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["A"],"explanation":"Storm、Flink、Spark Streaming等技术可以对连续数据流进行实时或准实时处理，因此大数据技术具备实时处理数据流的能力。","source":"self-test","officialId":"O1127"},{"id":"A075","paper":"A","number":75,"type":"judge","title":"75、数据录入过程、数据整合过程都可能会产生重复数据，直接删除是重复数据处理的主要方法。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["A"],"explanation":"官方题库对应题认为该说法正确。录入和整合都可能产生重复数据，而直接删除重复记录是常见且主要的处理方式之一；实际项目中仍应先识别和确认重复，再决定删除或合并。","source":"self-test","officialId":"O1128"},{"id":"A076","paper":"A","number":76,"type":"judge","title":"76、语音标注规则可以根据标注员的个人习惯灵活调整。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["B"],"explanation":"语音标注规则必须统一，才能让不同标注员得到一致结果。个人习惯只能在规则允许的边界内操作，不能随意调整标准。","source":"self-test","officialId":""},{"id":"A077","paper":"A","number":77,"type":"judge","title":"77、可以通过映射与化简的方式达到去重的目的。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["A"],"explanation":"MapReduce的映射阶段可提取键值，化简阶段按相同键聚合，因此能够用于发现和去除重复记录。这是分布式去重的常见思路。","source":"self-test","officialId":""},{"id":"A078","paper":"A","number":78,"type":"judge","title":"78、语音中只有“嗯”“啊”“呃”的无实际语义的语气词属于有效语音。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["B"],"explanation":"只包含“嗯、啊、呃”等语气词、没有实际语义内容的语音通常属于无效语音，应依据标注规范剔除或标记，不能视为有效语音。","source":"self-test","officialId":""},{"id":"A079","paper":"A","number":79,"type":"judge","title":"79、在AI数据处理架构中，数据存储库是数据的最终存储地，不参与数据转换过程。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["B"],"explanation":"数据存储库可以是最终存储地，也可能作为数据湖、湖仓或中间层参与清洗、转换和治理。说它“不参与数据转换”过于绝对。","source":"self-test","officialId":""},{"id":"A080","paper":"A","number":80,"type":"judge","title":"80、所有数据标注任务都可以使用同一种文件格式进行存储和表示。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["B"],"explanation":"不同标注任务需要不同格式，如图像分割常用掩码或COCO JSON，文本可用JSONL，点云可用专用二进制格式。不存在一种格式适用于所有任务。","source":"self-test","officialId":""},{"id":"A081","paper":"A","number":81,"type":"judge","title":"81、基于ETL的数据清洗是挖掘有价值数据的一种方案。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["A"],"explanation":"ETL通过抽取、转换和加载，把分散数据清洗、整理后送入分析环境，是挖掘有价值数据的重要方案。","source":"self-test","officialId":"O1254"},{"id":"A082","paper":"A","number":82,"type":"judge","title":"82、忽略该记录是缺失值处理方法。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["A"],"explanation":"忽略或删除缺失记录是缺失值处理的一种方法，适用于缺失比例很低或缺失没有系统规律的情况。是否最优还要结合业务判断。","source":"self-test","officialId":"O1255"},{"id":"A083","paper":"A","number":83,"type":"judge","title":"83、数据清洗时，对于缺失值的处理，简单的删除含有缺失值的记录通常不是最佳做法。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["A"],"explanation":"简单删除虽方便，但会损失样本并可能造成选择偏差，因此通常不是最佳做法。更稳妥的方法包括统计填充、模型插补或保留缺失指示特征。","source":"self-test","officialId":"O1256"},{"id":"A084","paper":"A","number":84,"type":"judge","title":"84、对于任何算法，优化其时间复杂度一定会增加其空间复杂度。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["B"],"explanation":"时间复杂度和空间复杂度可能此消彼长，也可能同时改善或同时变差，并不存在“优化时间一定增加空间”的普遍规律。","source":"self-test","officialId":""},{"id":"A085","paper":"A","number":85,"type":"judge","title":"85、算法改进后，性能评估报告应包括运行效率和资源消耗的对比。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["A"],"explanation":"算法改进不仅应看准确性，还应比较运行时间、吞吐量、内存和CPU等资源消耗，才能判断实际收益和代价。","source":"self-test","officialId":""},{"id":"A086","paper":"A","number":86,"type":"judge","title":"86、机器学习模型在作为标注者时，不需要任何形式的监督或验证。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["B"],"explanation":"模型预标注可能产生系统性偏差和置信度错误，必须通过人工抽检、置信度阈值和持续评估来监督，不能无验证地直接作为真值。","source":"self-test","officialId":"O1225"},{"id":"A087","paper":"A","number":87,"type":"judge","title":"87、可视化可用于支持可视化计算。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["A"],"explanation":"可视化不仅展示结果，还能辅助探索、交互式计算和假设验证，因此可以作为可视化计算的支撑手段。","source":"self-test","officialId":"O1227"},{"id":"A088","paper":"A","number":88,"type":"judge","title":"88、数据去重后，数据集中的记录数量一定会减少。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["B"],"explanation":"去重后记录数不一定减少。如果数据本身没有重复项，去重结果与原数据相同；只有存在重复记录时数量才会下降。","source":"self-test","officialId":"O1228"},{"id":"A089","paper":"A","number":89,"type":"judge","title":"89、内存容量越大，计算机性能一定越好。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["B"],"explanation":"内存只是影响性能的因素之一，CPU、磁盘、带宽、缓存、软件和任务类型同样重要。容量更大不必然意味着整体性能一定更好。","source":"self-test","officialId":""},{"id":"A090","paper":"A","number":90,"type":"judge","title":"90、算法的时间复杂度和实际运行时间是相同的概念。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["B"],"explanation":"时间复杂度描述输入规模增长时运算量的渐进趋势，实际运行时间还受硬件、实现语言、常数因子和输入分布影响，二者不是同一概念。","source":"self-test","officialId":""},{"id":"A091","paper":"A","number":91,"type":"judge","title":"91、算法的准确性可以通过单一的测试案例来全面评估。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["B"],"explanation":"单一测试案例只能覆盖一种输入情况，无法反映边界、异常和大规模数据下的表现。准确性评估需要足够覆盖率和统计意义的多组测试。","source":"self-test","officialId":"O1184"},{"id":"A092","paper":"A","number":92,"type":"judge","title":"92、对于所有算法，最好情况复杂度都比最坏情况复杂度更有用。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["B"],"explanation":"最好情况只代表最理想输入，最坏情况常用于保证性能上界，平均情况也有价值。哪种更有用取决于应用场景，不能一概而论。","source":"self-test","officialId":"O1185"},{"id":"A093","paper":"A","number":93,"type":"judge","title":"93、工匠精神强调的是对工作成果的完美追求，不包括创新和改进。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["B"],"explanation":"工匠精神既强调精益求精，也包含持续改进和创新。把创新排除在外是对工匠精神的片面理解。","source":"self-test","officialId":"O1186"},{"id":"A094","paper":"A","number":94,"type":"judge","title":"94、数据标注规则的制定需要考虑标注者的理解能力。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["A"],"explanation":"规则最终由标注员执行，如果表述超出其理解能力或缺少示例，就容易产生偏差。因此制定规则时要考虑人员背景、培训和可操作性。","source":"self-test","officialId":""},{"id":"A095","paper":"A","number":95,"type":"judge","title":"95、在数据标注流程中，标注工具的选择对标注效率和质量有重要影响（）。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["A"],"explanation":"合适的标注工具能提供快捷键、预标注、质量检查和格式导出等功能，直接影响标注速度与一致性，因此对效率和质量都有重要影响。","source":"self-test","officialId":""},{"id":"A096","paper":"A","number":96,"type":"judge","title":"96、在数据标注用于监督学习时，标注数据的质量是对模型训练结果有影响的。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["A"],"explanation":"监督学习依赖标注标签计算损失。标签错误、噪声或不一致会被模型学习，导致性能下降，因此标注质量直接影响训练结果。","source":"self-test","officialId":"O1270"},{"id":"A097","paper":"A","number":97,"type":"judge","title":"97、数据挖掘是逻辑回归的应用领域之一。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["A"],"explanation":"逻辑回归是经典的数据挖掘和分类建模方法，可用于信用评分、客户流失预测等数据挖掘场景。","source":"self-test","officialId":"O1271"},{"id":"A098","paper":"A","number":98,"type":"judge","title":"98、数据增强技术在视觉类业务数据处理中有助于提高模型的泛化能力。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["A"],"explanation":"旋转、裁剪、缩放、颜色扰动等数据增强能扩充样本变化，降低模型对特定外观的依赖，从而提高视觉任务的泛化能力。","source":"self-test","officialId":"O1272"},{"id":"A099","paper":"A","number":99,"type":"judge","title":"99、文本标注质量规范的目的是确保数据标注的一致性和可用性。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["A"],"explanation":"文本标注规范通过统一标签定义、边界和示例，确保不同标注员结果一致，并让标注数据能够被模型有效使用。","source":"self-test","officialId":""},{"id":"A100","paper":"A","number":100,"type":"judge","title":"100、在多标签标注中，同一个数据点只能被分配一个标签","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":["B"],"explanation":"多标签标注允许一个数据点同时拥有多个标签，例如一张图片同时包含“人、汽车、道路”。只能分配一个标签的是单标签或多分类标注。","source":"self-test","officialId":""},{"id":"B001","paper":"B","number":1,"type":"single","title":"1、校正数据偏差时，常用的加权方法是（  ）。","options":[{"key":"A","text":"为少数类样本分配更高的权重"},{"key":"B","text":"为多数类样本分配更高的权重"},{"key":"C","text":"随机分配权重"},{"key":"D","text":"按特征值大小分配权重"}],"answer":["A"],"explanation":"数据偏差常表现为类别不平衡。提高少数类样本权重，能让损失函数更重视少数类，从而校正模型对多数类的偏向；提高多数类权重会加重偏差。","source":"self-test","officialId":"O0030"},{"id":"B002","paper":"B","number":2,"type":"single","title":"2、在算法设计中，动态规划相对于贪心算法的优势在于（）。","options":[{"key":"A","text":"更快的执行速度"},{"key":"B","text":"更少的内存使用"},{"key":"C","text":"能够解决更广泛的问题"},{"key":"D","text":"更高的算法复杂度"}],"answer":["C"],"explanation":"动态规划通过保存子问题结果处理重叠子问题和最优子结构，适用范围比只做局部最优选择的贪心算法更广。它不一定更快或更省内存，复杂度也可能更高。","source":"self-test","officialId":"O0031"},{"id":"B003","paper":"B","number":3,"type":"single","title":"3、在视频数据标注中，物体识别的主要步骤不包括以下哪一项（）。","options":[{"key":"A","text":"绘制边界框"},{"key":"B","text":"视频剪辑"},{"key":"C","text":"物体跟踪"},{"key":"D","text":"属性标注"}],"answer":["B"],"explanation":"视频物体识别标注通常包括绘制边界框、跨帧物体跟踪和属性标注；视频剪辑属于后期制作，不是识别标注流程的必要步骤。","source":"self-test","officialId":""},{"id":"B004","paper":"B","number":4,"type":"single","title":"4、（）是一种降低复杂度的数据分析手段。","options":[{"key":"A","text":"文本分析"},{"key":"B","text":"模式分析"},{"key":"C","text":"自然语言处理"},{"key":"D","text":"数据特征降维"}],"answer":["D"],"explanation":"特征降维通过主成分分析、特征选择等方法减少变量数量，从而降低模型和分析过程的复杂度。文本分析、模式分析和自然语言处理不是通用的降维手段。","source":"self-test","officialId":""},{"id":"B005","paper":"B","number":5,"type":"single","title":"5、以下哪个是大数据分析中用于描述数据分布特征的统计量?","options":[{"key":"A","text":"平均值"},{"key":"B","text":"中位数"},{"key":"C","text":"众数"},{"key":"D","text":"所有选项"}],"answer":["D"],"explanation":"平均值、中位数和众数都是描述集中趋势的统计量，分别反映均值水平、中间位置和最频繁取值，因此三个选项都正确。","source":"self-test","officialId":""},{"id":"B006","paper":"B","number":6,"type":"single","title":"6、在随机森林算法中，随机性主要体现在哪些方面（）。","options":[{"key":"A","text":"随机选择特征进行分裂"},{"key":"B","text":"随机选择训练数据"},{"key":"C","text":"随机初始化模型参数"},{"key":"D","text":"随机选择模型的输出"}],"answer":["A"],"explanation":"随机森林在每棵树分裂时随机抽取候选特征，以降低树之间的相关性。它同时也通过自助采样引入样本随机性，但在给出的单选项中，A最直接描述其分裂机制。","source":"self-test","officialId":"O0047"},{"id":"B007","paper":"B","number":7,"type":"single","title":"7、以下哪个方法不是数据的无量纲化技术?","options":[{"key":"A","text":"标准化（Z-score normalization）"},{"key":"B","text":"最大最小规范化（Min-Max scaling）"},{"key":"C","text":"归一化（Normalization）"},{"key":"D","text":"离群值剔除"}],"answer":["D"],"explanation":"标准化、最大最小规范化和归一化都通过缩放改变量纲；离群值剔除是异常数据处理，不会把不同指标统一到可比较尺度。","source":"self-test","officialId":"O0048"},{"id":"B008","paper":"B","number":8,"type":"single","title":"8、算法异常定位的第一步通常是（  ）。","options":[{"key":"A","text":"检查硬件是否运行正常"},{"key":"B","text":"分析日志输出"},{"key":"C","text":"重新设计算法"},{"key":"D","text":"修改超参数"}],"answer":["B"],"explanation":"异常定位首先要收集证据，日志能记录输入、异常栈、耗时和状态变化，是最直接的入口。检查硬件、重构算法或调超参数应在定位原因后进行。","source":"self-test","officialId":""},{"id":"B009","paper":"B","number":9,"type":"single","title":"9、下列表述中，最能说明系统误差小的是（）。","options":[{"key":"A","text":"高精密度"},{"key":"B","text":"与已知的质量分数的试样多次分析结果的平均值一致"},{"key":"C","text":"标准差大"},{"key":"D","text":"仔细校正所用砝码和容量仪器等"}],"answer":["B"],"explanation":"系统误差反映结果整体偏高或偏低。多次分析均值与已知值一致，说明整体偏差小。高精密度、标准差大只能说明重复性；校正仪器是减少误差的手段。","source":"self-test","officialId":"O0062"},{"id":"B010","paper":"B","number":10,"type":"single","title":"10、人机交互方式多种多样，比如（）等，都是未来智能交互技术发展的方向。","options":[{"key":"A","text":"体感识别"},{"key":"B","text":"图像识别"},{"key":"C","text":"手势识别"},{"key":"D","text":"以上均正确"}],"answer":["D"],"explanation":"体感识别、图像识别和手势识别都是智能交互的重要方向，能够让人以更自然的方式与设备交流，因此应选“以上均正确”。","source":"self-test","officialId":""},{"id":"B011","paper":"B","number":11,"type":"single","title":"11、算法分析中，对数的底数对对数时间复杂度的影响是（）。","options":[{"key":"A","text":"非常大"},{"key":"B","text":"非常小"},{"key":"C","text":"可以忽略不计"},{"key":"D","text":"决定性的"}],"answer":["C"],"explanation":"根据换底公式，log_a n = log_b n / log_b a，不同底数之间只相差常数因子，而在大O渐进分析中常数因子可忽略，因此底数影响很小。","source":"self-test","officialId":"O0081"},{"id":"B012","paper":"B","number":12,"type":"single","title":"12、在支持向量机（SVM）中，核函数的作用是什么（）。","options":[{"key":"A","text":"增加模型的复杂度"},{"key":"B","text":"将数据映射到更高维的空间"},{"key":"C","text":"减少模型的训练时间"},{"key":"D","text":"限制模型的泛化能力"}],"answer":["B"],"explanation":"核函数把原始特征隐式映射到高维空间，使原本线性不可分的数据更容易被线性超平面分开。它不以增加复杂度或限制泛化为目标。","source":"self-test","officialId":""},{"id":"B013","paper":"B","number":13,"type":"single","title":"13、图像用户界面设计中，（  ）符合“简洁性”原则。","options":[{"key":"A","text":"在主界面显示所有高级选项"},{"key":"B","text":"仅呈现用户当前任务相关的必要信息"},{"key":"C","text":"使用复杂的图标和装饰"},{"key":"D","text":"将多级菜单嵌套在子菜单中"}],"answer":["B"],"explanation":"简洁性要求界面减少无关信息和视觉干扰，仅展示完成任务所需的关键内容。堆叠高级选项、复杂装饰或深层菜单都会增加认知负担。","source":"self-test","officialId":""},{"id":"B014","paper":"B","number":14,"type":"single","title":"14、AI数据管道中，将数据进行格式转换、特征提取等，使其适合模型训练的阶段指的是什么。","options":[{"key":"A","text":"传输（Transfer）"},{"key":"B","text":"转换（Transform）"},{"key":"C","text":"加载（Load）"},{"key":"D","text":"测试（Test）"}],"answer":["B"],"explanation":"ETL中的Transform阶段负责格式转换、清洗、特征提取和数据加工，使数据适合建模。传输、加载和测试分别对应其他环节。","source":"self-test","officialId":"O0100"},{"id":"B015","paper":"B","number":15,"type":"single","title":"15、分层抽样的主要目的是（  ）。","options":[{"key":"A","text":"减少样本数量"},{"key":"B","text":"确保每一类在样本中按比例存在"},{"key":"C","text":"提高采样速度"},{"key":"D","text":"提高数据的随机性"}],"answer":["B"],"explanation":"分层抽样按照总体中各类别的比例分别抽样，能够保留类别结构，特别适合类别不均衡的数据。它不是以提高速度或单纯增加随机性为主要目的。","source":"self-test","officialId":""},{"id":"B016","paper":"B","number":16,"type":"single","title":"16、在算法测试中，测试结果的分析通常不包括（）。","options":[{"key":"A","text":"模型的性能指标"},{"key":"B","text":"模型的预测能力"},{"key":"C","text":"模型的可解释性"},{"key":"D","text":"模型的市场占有率"}],"answer":["D"],"explanation":"算法测试结果通常分析性能指标、预测能力和可解释性。市场占有率属于商业运营指标，不是模型测试结果分析的常规内容。","source":"self-test","officialId":"O0120"},{"id":"B017","paper":"B","number":17,"type":"single","title":"17、在大数据处理中，MapReduce是一种广泛使用的编程模型，其主要思想是（）。","options":[{"key":"A","text":"将数据划分为多个小块并行处理"},{"key":"B","text":"只使用单个处理器进行数据处理"},{"key":"C","text":"将所有数据存储在单一数据库中"},{"key":"D","text":"通过多级索引来加速查询速度"}],"answer":["A"],"explanation":"MapReduce把任务拆成Map和Reduce两个阶段，将数据分块并分发到多个节点并行处理，再汇总结果。它不是单机处理或多级索引方法。","source":"self-test","officialId":""},{"id":"B018","paper":"B","number":18,"type":"single","title":"18、下列使用了语音识别技术的是（）。","options":[{"key":"A","text":"通过语音输入录入文本"},{"key":"B","text":"用“录言机”软件录制产音"},{"key":"C","text":"与国外的朋友电话聊天"},{"key":"D","text":"按导航仪的语音提示驾驶汽车"}],"answer":["A"],"explanation":"语音输入把人的语音转成文字，完整使用了语音识别技术。录音只是保存声音，电话聊天和导航语音提示不等于语音识别。","source":"self-test","officialId":""},{"id":"B019","paper":"B","number":19,"type":"single","title":"19、常见的数据标注工具的数据标注结果导出格式不包括（）。","options":[{"key":"A","text":"CSV"},{"key":"B","text":"XML"},{"key":"C","text":"JSON"},{"key":"D","text":"MP4"}],"answer":["D"],"explanation":"CSV、XML和JSON都可保存结构化标注信息；MP4是视频容器格式，不是常见的数据标注结果导出格式。","source":"self-test","officialId":""},{"id":"B020","paper":"B","number":20,"type":"single","title":"20、优化方案试运行能够（）。","options":[{"key":"A","text":"投入较多资金运作"},{"key":"B","text":"以高成本试错"},{"key":"C","text":"吸引大量人员参与"},{"key":"D","text":"以低成本试错"}],"answer":["D"],"explanation":"试运行的目的就是在小范围内验证方案、发现风险并以较低成本试错。大量投入、高成本试错或盲目扩大参与人数都违背试点原则。","source":"self-test","officialId":""},{"id":"B021","paper":"B","number":21,"type":"single","title":"21、语音识别的技术框架中不包括（）。","options":[{"key":"A","text":"模型训练"},{"key":"B","text":"编码"},{"key":"C","text":"前端语音处理"},{"key":"D","text":"后端识别处理"}],"answer":["B"],"explanation":"语音识别框架通常包含模型训练、前端语音处理和后端识别处理，编码不是这一技术框架的组成部分。需注意与数据编码、音频压缩等技术区分。","source":"self-test","officialId":""},{"id":"B022","paper":"B","number":22,"type":"single","title":"22、在分类任务中，标签的存在形式通常是（  ）。","options":[{"key":"A","text":"已知的类别标签"},{"key":"B","text":"通过距离计算自动生成"},{"key":"C","text":"需要通过无监督学习推断"},{"key":"D","text":"由聚类结果间接决定"}],"answer":["A"],"explanation":"分类任务属于监督学习，训练样本需要已知类别标签作为学习目标。距离聚类或从数据中推断标签属于无监督场景。","source":"self-test","officialId":"O0142"},{"id":"B023","paper":"B","number":23,"type":"single","title":"23、语音识别系统的主要挑战之一是（  ）。","options":[{"key":"A","text":"低功耗设计"},{"key":"B","text":"语音的歧义性和多样性"},{"key":"C","text":"实时处理能力"},{"key":"D","text":"语音合成的速度"}],"answer":["B"],"explanation":"语音存在口音、语速、噪声、同音词和表达多样性，造成声学信号和语义解释的歧义，这是语音识别的核心挑战。低功耗和实时性也重要，但并非最主要的技术难点。","source":"self-test","officialId":"O0143"},{"id":"B024","paper":"B","number":24,"type":"single","title":"24、数据脱敏技术的主要目的是（  ）。","options":[{"key":"A","text":"隐藏敏感数据"},{"key":"B","text":"加快数据处理速度"},{"key":"C","text":"优化数据库查询性能"},{"key":"D","text":"提高人工智能模型的准确性"}],"answer":["A"],"explanation":"数据脱敏通过掩码、泛化、替换或加密等方式隐藏身份证号、手机号等敏感信息，降低泄露风险。它不是性能优化或提升模型准确率的方法。","source":"self-test","officialId":"O0144"},{"id":"B025","paper":"B","number":25,"type":"single","title":"25、数据分析中，数据清洗的主要目的是（）。","options":[{"key":"A","text":"增加数据量"},{"key":"B","text":"提高数据质量"},{"key":"C","text":"减少计算资源"},{"key":"D","text":"降低模型复杂度"}],"answer":["B"],"explanation":"数据清洗通过处理缺失、重复、异常和不一致数据来提高质量，为后续分析提供可靠输入。增加数据量或降低模型复杂度不是其目标。","source":"self-test","officialId":"O0145"},{"id":"B026","paper":"B","number":26,"type":"single","title":"26、（）是深度学习中的一个重要的超参。","options":[{"key":"A","text":"学习率"},{"key":"B","text":"年化率"},{"key":"C","text":"年利率"},{"key":"D","text":"利用率"}],"answer":["A"],"explanation":"学习率决定每次参数更新的步长，是深度学习训练中最关键的超参数之一。年化率、年利率和利用率与本任务无关。","source":"self-test","officialId":""},{"id":"B027","paper":"B","number":27,"type":"single","title":"27、在大数据采集中，以下哪项不是主要的数据存储格式","options":[{"key":"A","text":"CSV文件"},{"key":"B","text":"JSON文件"},{"key":"C","text":"XML文件"},{"key":"D","text":"纸质记录"}],"answer":["D"],"explanation":"CSV、JSON和XML都是大数据系统中常见的文本或半结构化存储格式。纸质记录不是数字数据采集与存储格式。","source":"self-test","officialId":""},{"id":"B028","paper":"B","number":28,"type":"single","title":"28、朴素贝叶斯算法属于（）。","options":[{"key":"A","text":"有监督学习"},{"key":"B","text":"强化学习"},{"key":"C","text":"半监督学习"},{"key":"D","text":"无监督学习"}],"answer":["A"],"explanation":"朴素贝叶斯根据已知标签的样本来估计类别条件概率，因此属于有监督学习。强化学习依赖环境奖励，半监督和无监督不使用完整标签。","source":"self-test","officialId":"O0169"},{"id":"B029","paper":"B","number":29,"type":"single","title":"29、数据中的噪声通常指的是什么（）。","options":[{"key":"A","text":"数据中的有用信息"},{"key":"B","text":"数据中的随机误差或异常值"},{"key":"C","text":"数据中的缺失值"},{"key":"D","text":"数据中的重复记录"}],"answer":["B"],"explanation":"噪声是数据中影响真实信号表达的随机误差或无关波动，可能表现为异常值。缺失值和重复记录是另外两类数据质量问题。","source":"self-test","officialId":"O0170"},{"id":"B030","paper":"B","number":30,"type":"single","title":"30、IE浏览器中“收藏夹”菜单的作用是（）。","options":[{"key":"A","text":"收藏当前网页的网址信息"},{"key":"B","text":"收藏当前网页上选中的内容信息"},{"key":"C","text":"收藏当前网页中的图片信息"},{"key":"D","text":"收藏当前的网页中的视频信息"}],"answer":["A"],"explanation":"IE收藏夹保存网页网址，方便用户后续快速访问。它保存的是链接，而不是网页中选中的文字、图片或视频内容。","source":"self-test","officialId":""},{"id":"B031","paper":"B","number":31,"type":"single","title":"31、算法复杂性分析中，阿姆达尔定律（Amdahl's Law）主要用于评估（）。","options":[{"key":"A","text":"并行计算中程序加速比的上限"},{"key":"B","text":"算法的空间复杂度"},{"key":"C","text":"算法的最好情况时间复杂度"},{"key":"D","text":"算法的内存使用效率"}],"answer":["A"],"explanation":"Amdahl定律说明程序中可并行部分受串行部分限制，因此给出了并行化可获得加速比的理论上限。它不评价空间复杂度或最好情况。","source":"self-test","officialId":""},{"id":"B032","paper":"B","number":32,"type":"single","title":"32、下面哪种交互方式最接近人的自然交流形式（）。","options":[{"key":"A","text":"遥控板调节空调温度"},{"key":"B","text":"语音输入文字"},{"key":"C","text":"键盘输入"},{"key":"D","text":"用摇杆操控机器人"}],"answer":["B"],"explanation":"语音输入直接使用人类最自然的语言表达方式，最接近日常交流。遥控器、键盘和摇杆都需要用户学习特定的物理操作。","source":"self-test","officialId":"O0205"},{"id":"B033","paper":"B","number":33,"type":"single","title":"33、工匠精神的核心是什么（）。","options":[{"key":"A","text":"快速完成任务"},{"key":"B","text":"追求短期利益"},{"key":"C","text":"精益求精，追求卓越"},{"key":"D","text":"只关注个人技能提升"}],"answer":["C"],"explanation":"工匠精神强调专注、敬业、精益求精和对卓越的持续追求。快速完成、短期利益或只关注个人技能都不符合其核心内涵。","source":"self-test","officialId":"O0206"},{"id":"B034","paper":"B","number":34,"type":"single","title":"34、计算机病毒破坏的主要对象是（）。","options":[{"key":"A","text":"磁盘片"},{"key":"B","text":"磁盘驱动器"},{"key":"C","text":"CPU"},{"key":"D","text":"程序和数据"}],"answer":["D"],"explanation":"计算机病毒是一段可执行代码，主要破坏程序和数据，并可能影响系统运行。它不会直接损坏磁盘片、驱动器或CPU等硬件实体。","source":"self-test","officialId":""},{"id":"B035","paper":"B","number":35,"type":"single","title":"35、在特征选择领域，以下哪种方法不是用来减少特征数量的（）。","options":[{"key":"A","text":"前向选择"},{"key":"B","text":"后向消除"},{"key":"C","text":"正则化方法"},{"key":"D","text":"数据标准化"}],"answer":["D"],"explanation":"前向选择、后向消除和带正则化的方法都能减少或约束特征数量。数据标准化只改变数值尺度，不会删除特征。","source":"self-test","officialId":""},{"id":"B036","paper":"B","number":36,"type":"single","title":"36、在为数据集命名时，（  ）原则最为重要。","options":[{"key":"A","text":"使用随机字符组合"},{"key":"B","text":"保持命名简短但具有描述性"},{"key":"C","text":"优先采用主观创意命名法"},{"key":"D","text":"尽可能避免使用版本号"}],"answer":["B"],"explanation":"好的数据集名称应简短、可读并包含任务、版本或时间等描述信息，便于检索和复用。随机字符、主观创意或刻意省略版本号都会降低可管理性。","source":"self-test","officialId":"O0234"},{"id":"B037","paper":"B","number":37,"type":"single","title":"37、正态分布是以（）。","options":[{"key":"A","text":"均数为中心的频数分布"},{"key":"B","text":"t值为中心的频数分布"},{"key":"C","text":"参数为中心的频数分布"},{"key":"D","text":"变量为中心的频数分布"}],"answer":["A"],"explanation":"正态分布以均值为中心，呈左右对称的钟形分布，标准差决定分布的宽窄。t值或普通参数不是其中心定义。","source":"self-test","officialId":"O0235"},{"id":"B038","paper":"B","number":38,"type":"single","title":"38、在算法模型测试中，精确率（Precision）通常用来衡量什么（）。","options":[{"key":"A","text":"模型预测为正类的样本中，实际为正类的比例"},{"key":"B","text":"模型预测为负类的样本中，实际为负类的比例"},{"key":"C","text":"所有样本中，模型预测为正类的比例"},{"key":"D","text":"所有样本中，模型预测为负类的比例"}],"answer":["A"],"explanation":"精确率Precision=TP/(TP+FP)，表示模型预测为正类的样本中真正为正类的比例。B描述负类精确率，C、D只描述预测比例。","source":"self-test","officialId":""},{"id":"B039","paper":"B","number":39,"type":"single","title":"39、在进行语音标注时，可以借助（）的语音转文本工具。","options":[{"key":"A","text":"科大讯飞"},{"key":"B","text":"百度视频"},{"key":"C","text":"腾讯视频"},{"key":"D","text":"爱剪辑"}],"answer":["A"],"explanation":"科大讯飞提供成熟的语音转文字服务，可辅助语音标注。百度视频、腾讯视频和爱剪辑主要是视频平台或剪辑工具，不是语音识别工具。","source":"self-test","officialId":""},{"id":"B040","paper":"B","number":40,"type":"single","title":"40、XML格式在数据标注中的主要优势是（）。","options":[{"key":"A","text":"轻量级和易于阅读"},{"key":"B","text":"高度的表达能力"},{"key":"C","text":"对数学公式的良好支持"},{"key":"D","text":"广泛的软件支持"}],"answer":["B"],"explanation":"XML通过标签和层级结构表达复杂对象、嵌套关系和属性，因此具有较强表达能力。轻量易读更接近JSON/YAML的特点，数学公式和软件支持不是其主要优势。","source":"self-test","officialId":""},{"id":"B041","paper":"B","number":41,"type":"single","title":"41、（）是指为了得到一致假设而使假设变得过度严格。","options":[{"key":"A","text":"过拟合"},{"key":"B","text":"数据观察"},{"key":"C","text":"数据查看"},{"key":"D","text":"数据查阅"}],"answer":["A"],"explanation":"过拟合是模型过度贴合训练数据中的细节和噪声，使所学假设过于严格，导致泛化能力下降。数据观察、查看和查阅不属于模型拟合问题。","source":"self-test","officialId":""},{"id":"B042","paper":"B","number":42,"type":"single","title":"42、多元线性回归中的“线性”是指什么是线性（）。","options":[{"key":"A","text":"系数"},{"key":"B","text":"自变量"},{"key":"C","text":"因变量"},{"key":"D","text":"误差"}],"answer":["A"],"explanation":"线性回归的“线性”指模型对回归系数是线性的，即预测值可由特征乘系数后相加得到。自变量本身可以经过非线性变换，只要系数保持线性。","source":"self-test","officialId":"O0261"},{"id":"B043","paper":"B","number":43,"type":"single","title":"43、（）就是用类似漏斗的框架对事物进行分析的方法。","options":[{"key":"A","text":"对比分析法"},{"key":"B","text":"分组分析法"},{"key":"C","text":"预测分析法"},{"key":"D","text":"漏斗分析法"}],"answer":["D"],"explanation":"漏斗分析法按层级展示用户从进入到完成目标的转化过程，形似漏斗，适合定位流失环节。对比、分组和预测分析不以漏斗结构为核心。","source":"self-test","officialId":"O0262"},{"id":"B044","paper":"B","number":44,"type":"single","title":"44、以下哪个不是AI数据预处理工具的主要功能?","options":[{"key":"A","text":"数据抽取"},{"key":"B","text":"数据备份"},{"key":"C","text":"数据转换"},{"key":"D","text":"数据加载"}],"answer":["B"],"explanation":"AI数据预处理工具通常承担抽取、转换、清洗和加载等任务。数据备份属于运维和容灾功能，不是预处理工具的典型职责。","source":"self-test","officialId":"O0264"},{"id":"B045","paper":"B","number":45,"type":"single","title":"45、在数据标注团队中，以下哪个角色最可能负责标注数据的安全性和隐私保护（）。","options":[{"key":"A","text":"项目经理"},{"key":"B","text":"数据爬虫的IT人员"},{"key":"C","text":"质量控制专员"},{"key":"D","text":"数据分析师"}],"answer":["A"],"explanation":"项目经理对项目范围、流程、权限和合规负责，最可能承担数据安全与隐私保护的统筹职责。标注员、IT和数据科学家各有分工，但通常不是项目安全责任人。","source":"self-test","officialId":"O0267"},{"id":"B046","paper":"B","number":46,"type":"single","title":"46、在处理缺失值时，哪种方法通常被认为是最简单且常用的（）。","options":[{"key":"A","text":"使用均值填充缺失值"},{"key":"B","text":"使用回归模型预测缺失值"},{"key":"C","text":"删除含有缺失值的行"},{"key":"D","text":"使用K近邻算法填充缺失值"}],"answer":["C"],"explanation":"删除含缺失值的行是概念最简单、实现最直接的方法，适用于缺失比例较小且缺失随机的情况。均值填充、回归或KNN插补都需要额外判断或计算。","source":"self-test","officialId":""},{"id":"B047","paper":"B","number":47,"type":"single","title":"47、对于业务流程设计说法正确的是（）","options":[{"key":"A","text":"对重点业务调查即可"},{"key":"B","text":"关注重要产品即可"},{"key":"C","text":"企业流程设计需要对企业充分调查"},{"key":"D","text":"不要太多的协商讨论"}],"answer":["C"],"explanation":"业务流程设计需要全面调查企业的组织结构、业务活动和数据流，不能只关注重点业务或重要产品。充分协商也有助于发现约束和达成共识。","source":"self-test","officialId":"O0283"},{"id":"B048","paper":"B","number":48,"type":"single","title":"48、在二分类问题中，ROC曲线的横轴表示（）。","options":[{"key":"A","text":"真正率"},{"key":"B","text":"假正率"},{"key":"C","text":"召回率"},{"key":"D","text":"精确率"}],"answer":["B"],"explanation":"ROC曲线横轴为假正率FPR，纵轴为真正率TPR。真正率和召回率含义相同，但不是横轴。精确率通常出现在PR曲线中。","source":"self-test","officialId":""},{"id":"B049","paper":"B","number":49,"type":"single","title":"49、在算法分析中，最好情况时间复杂度是指（）。","options":[{"key":"A","text":"平均情况下的时间复杂度"},{"key":"B","text":"最坏情况下的时间复杂度"},{"key":"C","text":"可能情况下的最小时间复杂度"},{"key":"D","text":"以上都不正确"}],"answer":["C"],"explanation":"最好情况时间复杂度描述在所有合法输入中最理想情况下所需的运算量，是最小时间复杂度。它既不是平均值，也不是最坏值。","source":"self-test","officialId":"O0304"},{"id":"B050","paper":"B","number":50,"type":"single","title":"50、以下叙述中正确的是（）。","options":[{"key":"A","text":"数据库技术的根本目标是要解决数据共享的问题"},{"key":"B","text":"数据库不需要操作系统的支持"},{"key":"C","text":"数据库设计是指设计数据库管理系统"},{"key":"D","text":"数据库系统中，数据的物理结构必须与逻辑结构一致"}],"answer":["A"],"explanation":"数据库技术的重要目标是实现数据共享并减少冗余。数据库仍依赖操作系统；数据库设计针对具体数据库结构和应用；物理结构与逻辑结构也不必一致。","source":"self-test","officialId":"O0306"},{"id":"B051","paper":"B","number":51,"type":"single","title":"51、在算法测试中，留出法（Holdout method）通常用于（）。","options":[{"key":"A","text":"评估模型的泛化能力"},{"key":"B","text":"选择最优的模型参数"},{"key":"C","text":"增加模型训练的数据量"},{"key":"D","text":"减少模型训练的时间"}],"answer":["A"],"explanation":"留出法把数据划分为训练集和测试集，用未见过的测试集评估模型的泛化能力。模型参数通常还需在验证集上选择，不能仅靠一次留出划分完成。","source":"self-test","officialId":"O0329"},{"id":"B052","paper":"B","number":52,"type":"single","title":"52、对于大规模图像数据的存储和标注，哪种文件格式因其高效的压缩算法而更受欢迎（）。","options":[{"key":"A","text":"JSON"},{"key":"B","text":"CSV"},{"key":"C","text":"PNG"},{"key":"D","text":"HDF5"}],"answer":["D"],"explanation":"HDF5能在一个文件中组织大规模多维数组和元数据，支持压缩和分块读取，适合存储大规模图像数据集。JSON、CSV不适合直接存储海量像素，PNG是单图格式。","source":"self-test","officialId":""},{"id":"B053","paper":"B","number":53,"type":"single","title":"53、以下哪个不是大数据处理技术的特点（）。","options":[{"key":"A","text":"高效性"},{"key":"B","text":"容错性"},{"key":"C","text":"单一性"},{"key":"D","text":"可扩展性"}],"answer":["C"],"explanation":"大数据处理强调高效、容错、可扩展和分布式协作，不是追求单一性。单一技术或单一节点反而会成为扩展瓶颈。","source":"self-test","officialId":""},{"id":"B054","paper":"B","number":54,"type":"single","title":"54、在基于聚类的数据去重中，以下哪种聚类算法通常对球形数据簇效果较好（）。","options":[{"key":"A","text":"K - Means 算法"},{"key":"B","text":"DBSCAN 算法"},{"key":"C","text":"层次聚类算法"},{"key":"D","text":"高斯混合模型聚类算法"}],"answer":["A"],"explanation":"K-Means以簇中心划分样本，隐含假设簇近似球形且大小相近，因此对球形数据簇效果较好。DBSCAN适合任意形状，层次聚类和高斯混合模型适用面不同。","source":"self-test","officialId":""},{"id":"B055","paper":"B","number":55,"type":"single","title":"55、在数据标注中，若要标注图像中所有可识别的对象，应使用哪种类型的标注（）。","options":[{"key":"A","text":"分类标注"},{"key":"B","text":"实体标注"},{"key":"C","text":"关系标注"},{"key":"D","text":"场景标注"}],"answer":["B"],"explanation":"官方题库对应题的答案是“实体标注”。按该题库口径，面对图像中所有可识别对象，应选择实体标注；分类标注只给整体类别，关系标注强调对象间关系，场景标注并非本题首选。","source":"self-test","officialId":"O0408"},{"id":"B056","paper":"B","number":56,"type":"single","title":"56、特征构造不包括以下哪项活动（）。","options":[{"key":"A","text":"从原始数据中提取有用的信息"},{"key":"B","text":"创建新的特征以捕捉数据中的模式"},{"key":"C","text":"删除与目标变量无关的特征"},{"key":"D","text":"直接使用未经处理的原始数据进行模型训练"}],"answer":["D"],"explanation":"特征构造包括提取、组合、变换和生成新特征；删除无关特征属于特征选择。直接把未处理原始数据用于训练不属于特征构造。","source":"self-test","officialId":"O0521"},{"id":"B057","paper":"B","number":57,"type":"single","title":"57、文本数据标注中的命名实体识别属于哪种类型的标注（）。","options":[{"key":"A","text":"分类标注"},{"key":"B","text":"实体标注"},{"key":"C","text":"属性标注"},{"key":"D","text":"关系标注"}],"answer":["B"],"explanation":"命名实体识别识别人名、地名、机构名、时间等实体片段，属于实体标注。分类标注给整体文本定类，属性标注描述属性，关系标注连接实体。","source":"self-test","officialId":""},{"id":"B058","paper":"B","number":58,"type":"single","title":"58、训练模型最终的目的是将训练好的模型部署到（）中。","options":[{"key":"A","text":"实验环境"},{"key":"B","text":"理论环节"},{"key":"C","text":"现实环境"},{"key":"D","text":"任意环境"}],"answer":["C"],"explanation":"训练模型的最终价值是在真实业务环境中运行并产生效用。实验和理论环节用于研发验证，任意环境也可能缺少必要的数据和接口条件。","source":"self-test","officialId":""},{"id":"B059","paper":"B","number":59,"type":"single","title":"59、在数据分析中，数据的分辨率是指（）。","options":[{"key":"A","text":"数据的存储容量大小"},{"key":"B","text":"数据的采集频率"},{"key":"C","text":"数据的精确度和详细程度"},{"key":"D","text":"数据的可视化效果"}],"answer":["C"],"explanation":"数据分辨率反映数据的精细程度和精确度，例如时间粒度、空间精度或采样密度。它不是单指存储容量、可视化效果或固定采集频率。","source":"self-test","officialId":"O0534"},{"id":"B060","paper":"B","number":60,"type":"single","title":"60、局域网的协议结构—般不包括（）。","options":[{"key":"A","text":"网络层"},{"key":"B","text":"物理层"},{"key":"C","text":"数据链路层"},{"key":"D","text":"介质访问控制层"}],"answer":["A"],"explanation":"局域网协议结构通常围绕物理层、数据链路层和介质访问控制层展开，网络层更多用于跨网络路由，不是局域网协议结构的必要部分。","source":"self-test","officialId":""},{"id":"B061","paper":"B","number":61,"type":"multiple","title":"61、在大数据技术中，以下哪些是用于提高数据处理效率的技术【多选题】","options":[{"key":"A","text":"数据分区"},{"key":"B","text":"内存计算"},{"key":"C","text":"多线程处理"},{"key":"D","text":"云计算资源动态扩展"}],"answer":["A","B","C","D"],"explanation":"分区可并行扫描，内存计算减少磁盘I/O，多线程提高并发度，云资源弹性扩展可按负载调度，四者都能提高大数据处理效率。","source":"self-test","officialId":"O0865"},{"id":"B062","paper":"B","number":62,"type":"multiple","title":"62、根据表现形式，用户界面包括（）。【多选题】","options":[{"key":"A","text":"命令行界面"},{"key":"B","text":"图形界面"},{"key":"C","text":"自然用户界面"},{"key":"D","text":"自适应界面"}],"answer":["A","B","C"],"explanation":"按表现形式，用户界面通常分为命令行界面、图形界面和自然用户界面。自适应界面强调随环境或用户变化调整，是设计策略而非独立的表现形式。","source":"self-test","officialId":""},{"id":"B063","paper":"B","number":63,"type":"multiple","title":"63、以下哪些是标注过程中可能考虑的标注属性（）。【多选题】","options":[{"key":"A","text":"位置信息"},{"key":"B","text":"大小信息"},{"key":"C","text":"颜色信息"},{"key":"D","text":"纹理信息"}],"answer":["A","B","C","D"],"explanation":"位置、大小、颜色和纹理都是可观察、可描述的视觉属性，根据不同标注任务都可能成为标签或属性字段。","source":"self-test","officialId":"O0891"},{"id":"B064","paper":"B","number":64,"type":"multiple","title":"64、企业在培养员工职业道德时，应注重哪些方面（）。【多选题】","options":[{"key":"A","text":"遵守法律法规"},{"key":"B","text":"追求个人利益最大化"},{"key":"C","text":"诚实守信"},{"key":"D","text":"团队合作"}],"answer":["A","C","D"],"explanation":"职业道德培养应强调守法、诚信和团队合作，并兼顾企业与社会责任。追求个人利益最大化可能损害组织和客户利益，不属于职业道德建设方向。","source":"self-test","officialId":""},{"id":"B065","paper":"B","number":65,"type":"multiple","title":"65、在机器学习中，以下哪些因素可能影响模型的泛化能力（）。【多选题】","options":[{"key":"A","text":"训练数据的多样性"},{"key":"B","text":"模型的过拟合"},{"key":"C","text":"模型的欠拟合"},{"key":"D","text":"模型的复杂度"}],"answer":["A","B","C","D"],"explanation":"训练数据多样性决定覆盖范围，过拟合会使模型记住训练集，欠拟合无法学到规律，模型复杂度则影响偏差与方差的平衡，四者都会影响泛化。","source":"self-test","officialId":"O0912"},{"id":"B066","paper":"B","number":66,"type":"multiple","title":"66、以下（  ）会导致语音类业务数据出现失真。【多选题】","options":[{"key":"A","text":"设备故障"},{"key":"B","text":"网络拥塞"},{"key":"C","text":"强磁场干扰"},{"key":"D","text":"语音编码算法缺陷"}],"answer":["A","B","C","D"],"explanation":"设备故障可造成采样异常，网络拥塞会丢包或延迟，强磁场可能引入干扰，编码算法缺陷会造成压缩失真，均可能导致语音数据失真。","source":"self-test","officialId":"O0931"},{"id":"B067","paper":"B","number":67,"type":"multiple","title":"67、在数据标注项目中，以下哪些措施是确保标注质量的关键控制方法（）。【多选题】","options":[{"key":"A","text":"制定和遵循详细的标注指南"},{"key":"B","text":"对标注员进行定期的技能培训和测试"},{"key":"C","text":"实施标注结果的随机抽样和全面审核"},{"key":"D","text":"采用自动化工具辅助检测标注错误"}],"answer":["A","B","C","D"],"explanation":"详细指南统一口径，培训提高能力，抽样和全审发现错误，自动化工具辅助检测异常，四者共同构成标注质量控制闭环。","source":"self-test","officialId":""},{"id":"B068","paper":"B","number":68,"type":"multiple","title":"68、以下哪些因素会影响算法测试结果的准确性（）。【多选题】","options":[{"key":"A","text":"测试数据的质量"},{"key":"B","text":"测试用例的覆盖率"},{"key":"C","text":"算法的实现细节"},{"key":"D","text":"测试执行的随机性"}],"answer":["A","B","C","D"],"e
