    const PAPER_KEYS = ["A", "B", "C", "O"];
    const PAPER_NAMES = { A: "自测卷 A", B: "自测卷 B", C: "自测卷 C", O: "官方题库" };
    const TYPE_NAMES = { single: "单选题", multiple: "多选题", judge: "判断题" };
    const STORAGE_KEY = "ai-trainer-quiz-v1";
    const PALETTE_PAGE_SIZE = 100;
    const EXAM_SECONDS = 90 * 60;

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const questionMap = new Map(QUESTIONS.map((q) => [q.id, q]));
    const paperQuestions = Object.fromEntries(PAPER_KEYS.map((paper) => [
      paper,
      QUESTIONS.filter((q) => q.paper === paper).sort((a, b) => a.number - b.number)
    ]));

    let store = loadStore();
    let state = store.states[store.currentPaper];
    let toastTimer = null;

    function blankState(paper) {
      return {
        paper,
        current: 0,
        answers: {},
        checked: {},
        bookmarks: {},
        mode: "practice",
        orderMode: "sequence",
        order: paperQuestions[paper].map((q) => q.id),
        filter: "all",
        search: "",
        palettePage: 0,
        submitted: false,
        examElapsed: 0,
        timerRunning: false
      };
    }

    function loadStore() {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch (_) {}
      const result = {
        currentPaper: PAPER_KEYS.includes(saved?.currentPaper) ? saved.currentPaper : "A",
        states: {}
      };
      for (const paper of PAPER_KEYS) {
        result.states[paper] = saved?.states?.[paper]
          ? { ...blankState(paper), ...saved.states[paper] }
          : blankState(paper);
        const ids = new Set(paperQuestions[paper].map((q) => q.id));
        result.states[paper].order = (result.states[paper].order || []).filter((id) => ids.has(id));
        const size = paperQuestions[paper].length;
        if (result.states[paper].order.length !== size) {
          result.states[paper].order = paperQuestions[paper].map((q) => q.id);
        }
        result.states[paper].current = Math.min(
          Math.max(Number(result.states[paper].current) || 0, 0),
          size - 1
        );
        result.states[paper].palettePage = Math.max(
          Number(result.states[paper].palettePage) || 0,
          0
        );
      }
      return result;
    }

    function paperSize(paper = state.paper) {
      return paperQuestions[paper].length;
    }

    function save() {
      store.states[state.paper] = state;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch (_) {}
    }

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function icon(name, cls = "") {
      return `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
    }

    function questionsForOrder(paper = state.paper) {
      return state.order.map((id) => questionMap.get(id)).filter(Boolean);
    }

    function currentQuestion() {
      return questionsForOrder()[state.current] || questionsForOrder()[0];
    }

    function selectedAnswer(question) {
      return Array.isArray(state.answers[question.id]) ? state.answers[question.id] : [];
    }

    function normalizeAnswer(answer, question) {
      const available = new Set(question.options.map((option) => option.key));
      return [...new Set(answer.filter((key) => available.has(key)))]
        .sort((a, b) => question.options.findIndex((o) => o.key === a) - question.options.findIndex((o) => o.key === b));
    }

    function isAnswerCorrect(question, answer = selectedAnswer(question)) {
      const picked = normalizeAnswer(answer, question);
      const expected = normalizeAnswer(question.answer, question);
      return picked.length === expected.length && picked.every((key, index) => key === expected[index]);
    }

    function isAnswered(question) {
      return selectedAnswer(question).length > 0;
    }

    function isRevealed(question) {
      return state.submitted || (state.mode === "practice" && Boolean(state.checked[question.id]));
    }

    function isQuestionWrong(question) {
      if (state.submitted) return !isAnswered(question) || !isAnswerCorrect(question);
      return Boolean(state.checked[question.id]) && !isAnswerCorrect(question);
    }

    function summary() {
      const questions = paperQuestions[state.paper];
      const answered = questions.filter(isAnswered).length;
      const correct = questions.filter((q) => isAnswerCorrect(q) && (state.submitted || state.checked[q.id])).length;
      const wrong = questions.filter(isQuestionWrong).length;
      const bookmarked = questions.filter((q) => state.bookmarks[q.id]).length;
      return { answered, correct, wrong, bookmarked, score: correct };
    }

    let searchSaveTimer = null;

    function renderAll({ sidebar = true } = {}) {
      renderTopbar();
      if (sidebar) renderSidebar();
      else updateSidebarStatus();
      renderQuestion();
      save();
    }

    function renderTopbar() {
      $$(".paper-tab").forEach((button) => button.classList.toggle("active", button.dataset.paper === state.paper));
      updateTimerView();
      $("#topSubmitBtn").classList.toggle("hidden", state.mode !== "exam" || state.submitted);
    }

    function buildSidebarHtml() {
      const data = summary();
      const rate = Math.round((data.answered / paperSize()) * 100);
      const visible = visibleQuestions();
      const paletteItems = paletteQuestions();
      const pageCount = palettePageCount();
      state.palettePage = Math.min(state.palettePage, pageCount - 1);
      const chapter = state.paper === "O" ? "官方题库" : (state.mode === "exam" ? "模拟考试" : "练习模式");
      return `
        <div class="sidebar-section">
          <div class="paper-tabs" aria-label="选择题库" style="width:100%; display:grid; grid-template-columns:repeat(4,1fr);">
            ${PAPER_KEYS.map((paper) => `<button class="paper-tab ${paper === state.paper ? "active" : ""}" data-action="paper" data-paper="${paper}">${paper === "O" ? "官方" : `${paper} 卷`}</button>`).join("")}
          </div>
        </div>
        <div class="sidebar-section">
          <div class="progress-top">
            <div class="progress-number"><em class="js-answered">${data.answered}</em><span>/ ${paperSize()}</span></div>
            <div class="progress-rate js-progress-rate">${rate}%</div>
          </div>
          <div class="progress-track"><div class="progress-fill js-progress-fill" style="width:${rate}%"></div></div>
          <div class="stat-line">
            <div class="stat-item"><strong class="js-correct">${data.correct}</strong><span>答对</span></div>
            <div class="stat-item"><strong class="js-wrong">${data.wrong}</strong><span>错题</span></div>
            <div class="stat-item"><strong class="js-bookmarked">${data.bookmarked}</strong><span>收藏</span></div>
          </div>
        </div>
        <div class="sidebar-section">
          <p class="section-label">答题模式</p>
          ${state.paper === "O"
            ? `<div class="official-mode-note">官方题库 · 1445 题<br>支持搜索、错题、收藏与随机练习</div>`
            : `<div class="segmented">
                <button class="segment ${state.mode === "practice" ? "active" : ""}" data-action="mode" data-mode="practice">${icon("book", "icon-sm")}练习</button>
                <button class="segment ${state.mode === "exam" ? "active" : ""}" data-action="mode" data-mode="exam">${icon("clock", "icon-sm")}模拟</button>
              </div>`}
          <div class="segmented row-gap">
            <button class="segment ${state.orderMode === "sequence" ? "active" : ""}" data-action="order" data-order="sequence">${icon("list", "icon-sm")}顺序</button>
            <button class="segment ${state.orderMode === "random" ? "active" : ""}" data-action="order" data-order="random">${icon("shuffle", "icon-sm")}随机</button>
          </div>
        </div>
        <div class="sidebar-section">
          <p class="section-label">定位题目</p>
          <label class="search-wrap">
            <span class="sr-only">搜索题目或题号</span>
            ${icon("search")}
            <input class="search-input" id="questionSearch" type="search" placeholder="搜索题目或题号" value="${esc(state.search)}" autocomplete="off">
          </label>
          <div class="filter-row row-gap">
            ${filterButton("all", "全部")}
            ${filterButton("unanswered", "未答")}
            ${filterButton("wrong", "错题")}
            ${filterButton("bookmark", "收藏")}
          </div>
        </div>
        <div class="sidebar-section">
          <div class="palette-head">
            <p class="section-label">答题卡</p>
            <span class="palette-count">${visible.length} 题 · ${chapter}</span>
          </div>
          <div class="palette">
            ${paletteItems.length ? paletteItems.map(questionDot).join("") : `<div class="empty-palette">没有符合条件的题目</div>`}
          </div>
          ${pageCount > 1 ? `<div class="palette-pager">
            <button class="soft-btn" data-action="palette-page" data-page="${state.palettePage - 1}" ${state.palettePage <= 0 ? "disabled" : ""}>${icon("chevron-left", "icon-sm")}上一页</button>
            <span>${state.palettePage + 1} / ${pageCount}</span>
            <button class="soft-btn" data-action="palette-page" data-page="${state.palettePage + 1}" ${state.palettePage >= pageCount - 1 ? "disabled" : ""}>下一页${icon("chevron-right", "icon-sm")}</button>
          </div>` : ""}
        </div>
        <div class="sidebar-section">
          <div class="sidebar-actions">
            <button class="soft-btn" data-action="open-result">${icon("target", "icon-sm")}成绩</button>
            <button class="soft-btn danger" data-action="reset-paper">${icon("rotate", "icon-sm")}重置</button>
          </div>
        </div>
      `;
    }

    function palettePageCount() {
      return Math.max(1, Math.ceil(visibleQuestions().length / PALETTE_PAGE_SIZE));
    }

    function paletteQuestions() {
      const visible = visibleQuestions();
      const page = Math.max(Number(state.palettePage) || 0, 0);
      return visible.slice(page * PALETTE_PAGE_SIZE, (page + 1) * PALETTE_PAGE_SIZE);
    }

    function renderSidebar() {
      const sidebarHtml = buildSidebarHtml();
      $("#sidebar").innerHTML = sidebarHtml;
      if (!$("#mobileSheet").classList.contains("hidden")) {
        $("#mobileSidebar").innerHTML = sidebarHtml;
      }
    }

    function updateSidebarStatus() {
      const data = summary();
      const rate = Math.round((data.answered / paperSize()) * 100);
      $$(".js-answered").forEach((node) => { node.textContent = data.answered; });
      $$(".js-progress-rate").forEach((node) => { node.textContent = `${rate}%`; });
      $$(".js-progress-fill").forEach((node) => { node.style.width = `${rate}%`; });
      $$(".js-correct").forEach((node) => { node.textContent = data.correct; });
      $$(".js-wrong").forEach((node) => { node.textContent = data.wrong; });
      $$(".js-bookmarked").forEach((node) => { node.textContent = data.bookmarked; });
      $$(".q-dot").forEach((button) => {
        const question = questionMap.get(button.dataset.id);
        if (question) button.className = questionDotClass(question);
      });
      if (["unanswered", "wrong", "bookmark"].includes(state.filter)) rerenderAfterSearch();
    }

    function rerenderAfterSearch(eventTarget = null) {
      const visible = visibleQuestions();
      state.palettePage = Math.min(
        Math.max(Number(state.palettePage) || 0, 0),
        Math.max(0, Math.ceil(visible.length / PALETTE_PAGE_SIZE) - 1)
      );
      const paletteItems = paletteQuestions();
      const palette = $("#sidebar .palette");
      const mobilePalette = $("#mobileSidebar .palette");
      if (palette) palette.innerHTML = paletteItems.length ? paletteItems.map(questionDot).join("") : `<div class="empty-palette">没有符合条件的题目</div>`;
      if (mobilePalette) mobilePalette.innerHTML = paletteItems.length ? paletteItems.map(questionDot).join("") : `<div class="empty-palette">没有符合条件的题目</div>`;
      const counts = [$("#sidebar .palette-count"), $("#mobileSidebar .palette-count")];
      counts.forEach((node) => { if (node) node.textContent = `${visible.length} 题 · ${state.paper === "O" ? "官方题库" : (state.mode === "exam" ? "模拟考试" : "练习模式")}`; });
      $$(".search-input").forEach((input) => {
        if (input !== eventTarget) input.value = state.search;
      });
      clearTimeout(searchSaveTimer);
      searchSaveTimer = setTimeout(save, 180);
    }

    function filterButton(filter, label) {
      return `<button class="filter-chip ${state.filter === filter ? "active" : ""}" data-action="filter" data-filter="${filter}">${label}</button>`;
    }

    function visibleQuestions() {
      const query = state.search.trim().toLowerCase();
      return paperQuestions[state.paper].filter((question) => {
        if (state.filter === "unanswered" && isAnswered(question)) return false;
        if (state.filter === "wrong" && !isQuestionWrong(question)) return false;
        if (state.filter === "bookmark" && !state.bookmarks[question.id]) return false;
        if (!query) return true;
        const haystack = `${question.id} ${question.number} ${question.officialId || ""} ${question.selfTestId || ""} ${question.title} ${question.options.map((o) => o.text).join(" ")}`.toLowerCase();
        return haystack.includes(query);
      });
    }

    function questionDot(question) {
      return `<button
        class="${questionDotClass(question)}"
        data-action="jump"
        data-id="${question.id}"
        title="第 ${question.number} 题"
        aria-label="第 ${question.number} 题"
      >${question.number}</button>`;
    }

    function questionDotClass(question) {
      const orderIndex = state.order.indexOf(question.id);
      const current = orderIndex === state.current;
      const answered = isAnswered(question);
      const correct = isRevealed(question) && isAnswerCorrect(question);
      const wrong = isQuestionWrong(question);
      return [
        "q-dot",
        answered ? "is-answered" : "",
        correct ? "is-correct" : "",
        wrong ? "is-wrong" : "",
        current ? "is-current" : "",
        state.bookmarks[question.id] ? "is-bookmarked" : ""
      ].filter(Boolean).join(" ");
    }

    function renderQuestion() {
      const question = currentQuestion();
      if (!question) return;
      const answer = selectedAnswer(question);
      const revealed = isRevealed(question);
      const correct = isAnswerCorrect(question);
      const typeLabel = TYPE_NAMES[question.type];
      const typeClass = question.type;
      const bookmark = Boolean(state.bookmarks[question.id]);
      const sourceLabel = question.source === "official" ? "官方题库" : PAPER_NAMES[question.paper];
      const relationLabel = question.source === "official"
        ? (question.selfTestId ? `自测卷：${question.selfTestId}` : "")
        : (question.officialId ? `官方题号：${question.officialId}` : "");
      const modeLabel = state.paper === "O" ? "题库练习" : (state.mode === "exam" ? "模拟考试" : "练习模式");
      const knowledgeLabel = question.knowledge ? `知识点：${question.knowledge}` : "";
      const questionActions = question.type === "multiple" && state.mode === "practice" && !revealed
        ? `<button class="primary-btn" data-action="submit-current">${icon("send", "icon-sm")}提交答案</button>`
        : "";

      const explanation = revealed ? `
        <section class="explanation ${correct ? "" : "is-wrong"}">
          <div class="explanation-head">
            <span class="explanation-title">${correct ? "回答正确" : "本题解析"}</span>
            <span class="answer-pill">正确答案：${question.answer.join("、")}</span>
          </div>
          ${knowledgeLabel ? `<div class="knowledge-line">${esc(knowledgeLabel)}</div>` : ""}
          <p>${esc(question.explanation)}</p>
        </section>
      ` : "";

      $("#main").innerHTML = `
        <div class="main-toolbar">
          <div class="crumbs">
            <button class="icon-btn mobile-only" data-action="open-sidebar" title="打开答题卡" aria-label="打开答题卡">${icon("panel")}</button>
            <strong>${PAPER_NAMES[state.paper]}</strong>
            <span>/</span>
            <span>第 ${state.current + 1} 题，共 ${paperSize()} 题</span>
          </div>
          <div class="toolbar-actions">
            <button class="icon-btn ${bookmark ? "active" : ""}" data-action="bookmark" title="${bookmark ? "取消收藏" : "收藏本题"}" aria-label="${bookmark ? "取消收藏" : "收藏本题"}">${icon("bookmark")}</button>
            <button class="icon-btn" data-action="open-result" title="查看成绩" aria-label="查看成绩">${icon("trophy")}</button>
            ${state.mode === "exam" && !state.submitted ? `<button class="primary-btn mobile-only" data-action="submit-exam">${icon("send", "icon-sm")}交卷</button>` : ""}
          </div>
        </div>

        <div class="question-wrap">
          <div class="question-meta">
            <span class="type-badge ${typeClass}">${typeLabel}</span>
            <span class="number-badge">第 ${question.number} 题</span>
            <span class="number-badge">${modeLabel}</span>
            <span class="number-badge">${sourceLabel}</span>
            ${relationLabel ? `<span class="number-badge relation-badge">${relationLabel}</span>` : ""}
          </div>
          <h2 class="question-title">${esc(question.title)}</h2>
          <p class="question-note">${question.type === "multiple" ? "选择所有正确选项后提交" : "选择你认为正确的答案"}</p>

          <div class="options" role="group" aria-label="选项">
            ${question.options.map((option) => renderOption(question, option, answer, revealed)).join("")}
          </div>

          ${explanation}

          <div class="question-actions">
            <div class="nav-group">
              <button class="secondary-btn" data-action="prev" ${state.current === 0 ? "disabled" : ""}>${icon("chevron-left", "icon-sm")}上一题</button>
              <button class="secondary-btn" data-action="next" ${state.current === paperSize() - 1 ? "disabled" : ""}>下一题${icon("chevron-right", "icon-sm")}</button>
            </div>
            <div class="nav-group">
              <span class="question-progress-copy">${summary().answered} / ${paperSize()} 已答</span>
              ${questionActions}
            </div>
          </div>
          <p class="footer-note">${question.source === "official"
            ? "本题来自官方初赛理论题库；未提供逐题解析的题目按官方答案与知识点整理。正式考试要求以考务通知为准。"
            : "三套自测卷已与官方理论题库核对；同一道题以官方答案为准。正式考试要求以考务通知为准。"}</p>
        </div>
      `;
    }

    function renderOption(question, option, answer, revealed) {
      const selected = answer.includes(option.key);
      const expected = question.answer.includes(option.key);
      const isCorrectOption = revealed && expected;
      const isWrongSelection = revealed && selected && !expected;
      const classes = [
        "option",
        question.type,
        selected ? "selected" : "",
        isCorrectOption ? "correct" : "",
        isWrongSelection ? "wrong" : ""
      ].filter(Boolean).join(" ");
      let stateIcon = "";
      if (isCorrectOption) stateIcon = icon("check-circle", "icon-sm");
      if (isWrongSelection) stateIcon = icon("x-circle", "icon-sm");
      const disabled = (state.mode === "practice" && revealed) || state.submitted;
      return `<button class="${classes}" data-action="option" data-key="${option.key}" ${disabled ? "disabled" : ""} aria-pressed="${selected}">
        <span class="option-key">${option.key}</span>
        <span class="option-text">${esc(option.text)}</span>
        <span class="option-state">${stateIcon}</span>
      </button>`;
    }

    function selectOption(key) {
      const question = currentQuestion();
      if (!question || state.submitted) return;
      if (state.mode === "practice" && state.checked[question.id]) return;
      const current = selectedAnswer(question);
      let next;
      if (question.type === "multiple") {
        next = current.includes(key) ? current.filter((item) => item !== key) : [...current, key];
      } else {
        next = [key];
      }
      next = normalizeAnswer(next, question);
      if (next.length) state.answers[question.id] = next;
      else delete state.answers[question.id];
      if (state.mode === "exam" && !state.timerRunning && !state.submitted) {
        state.timerRunning = true;
      }
      if (state.mode === "practice" && question.type !== "multiple") {
        state.checked[question.id] = true;
      }
      renderAll({ sidebar: false });
    }

    function submitCurrent() {
      const question = currentQuestion();
      if (!question) return;
      if (!isAnswered(question)) {
        showToast("请先选择答案");
        return;
      }
      state.checked[question.id] = true;
      renderAll({ sidebar: false });
    }

    function toggleBookmark() {
      const question = currentQuestion();
      if (!question) return;
      if (state.bookmarks[question.id]) {
        delete state.bookmarks[question.id];
        showToast("已取消收藏");
      } else {
        state.bookmarks[question.id] = true;
        showToast("已加入收藏");
      }
      renderAll({ sidebar: false });
    }

    function go(delta) {
      const next = state.current + delta;
      if (next < 0) return;
      if (next >= paperSize()) {
        if (state.mode === "exam" && !state.submitted) submitExam();
        return;
      }
      state.current = next;
      syncPaletteToCurrent();
      renderAll({ sidebar: false });
      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function jumpTo(id) {
      const index = state.order.indexOf(id);
      if (index < 0) return;
      state.current = index;
      syncPaletteToCurrent();
      renderAll({ sidebar: false });
      closeSidebar();
      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function syncPaletteToCurrent() {
      const question = currentQuestion();
      if (!question) return;
      const visible = visibleQuestions();
      const visibleIndex = visible.findIndex((item) => item.id === question.id);
      if (visibleIndex >= 0) {
        state.palettePage = Math.floor(visibleIndex / PALETTE_PAGE_SIZE);
      }
    }

    function switchPaper(paper) {
      if (!PAPER_KEYS.includes(paper) || paper === state.paper) return;
      save();
      store.currentPaper = paper;
      state = store.states[paper] || blankState(paper);
      renderAll();
      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function setMode(mode) {
      if (!["practice", "exam"].includes(mode) || state.mode === mode) return;
      if (state.paper === "O") {
        showToast("官方题库使用练习模式，共 1445 题");
        return;
      }
      const hadProgress = summary().answered > 0;
      if (hadProgress && !confirm(`切换到${mode === "exam" ? "模拟考试" : "练习模式"}将重新开始本卷的批改状态，已选答案会保留。是否继续？`)) return;
      state.mode = mode;
      state.checked = {};
      state.submitted = false;
      state.examElapsed = 0;
      state.timerRunning = false;
      renderAll();
    }

    function setOrder(mode) {
      if (!["sequence", "random"].includes(mode) || state.orderMode === mode) return;
      state.orderMode = mode;
      let ids = paperQuestions[state.paper].map((q) => q.id);
      if (mode === "random") {
        for (let i = ids.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [ids[i], ids[j]] = [ids[j], ids[i]];
        }
      }
      state.order = ids;
      state.current = 0;
      state.palettePage = 0;
      renderAll();
      showToast(mode === "random" ? "已打乱题目顺序" : "已恢复原题顺序");
    }

    function submitExam() {
      if (state.mode !== "exam") {
        openResult();
        return;
      }
      if (state.submitted) {
        openResult();
        return;
      }
      const data = summary();
      const unanswered = paperSize() - data.answered;
      if (unanswered > 0 && !confirm(`还有 ${unanswered} 题未作答，未答题按错误计分。确定交卷吗？`)) return;
      state.submitted = true;
      state.timerRunning = false;
      state.checked = Object.fromEntries(paperQuestions[state.paper].map((q) => [q.id, true]));
      save();
      renderAll();
      openResult();
    }

    function resetPaper() {
      if (!confirm(`确定重置${PAPER_NAMES[state.paper]}的全部作答、收藏和计时吗？`)) return;
      store.states[state.paper] = blankState(state.paper);
      state = store.states[state.paper];
      closeModal();
      renderAll();
      showToast("本卷已重置");
    }

    function openResult() {
      const data = summary();
      const elapsed = state.examElapsed;
      const minutes = String(Math.floor(elapsed / 60)).padStart(2, "0");
      const seconds = String(elapsed % 60).padStart(2, "0");
      const score = data.score;
      const title = state.submitted ? "本次成绩" : (state.mode === "exam" ? "模拟考试" : "练习进度");
      const message = state.submitted
        ? (score >= 90 ? "基础扎实，继续保持。" : score >= 60 ? "已掌握主要内容，建议复盘错题。" : "建议结合解析逐题巩固。")
        : "当前只统计已批改的练习题目。";
      const modal = $("#resultModal");
      modal.innerHTML = `
        <div class="result-card">
          <div class="result-head">
            <div>
              <p class="result-eyebrow">${PAPER_NAMES[state.paper]}</p>
              <h2 class="result-title" id="resultTitle">${title}</h2>
            </div>
            <button class="icon-btn" data-action="close-modal" aria-label="关闭">${icon("x")}</button>
          </div>
          <div class="result-body">
            <div class="score-row">
              <div class="score-ring" style="--score:${score}">
                <div class="score-value">${score}<small>分</small></div>
              </div>
              <div class="score-copy">
                <h3>${state.submitted ? "本次自测已完成" : "继续完成本卷"}</h3>
                <p>${message}</p>
              </div>
            </div>
            <div class="result-grid">
              <div class="result-stat"><span>已答</span><strong>${data.answered} / ${paperSize()}</strong></div>
              <div class="result-stat"><span>答对</span><strong>${data.correct}</strong></div>
              <div class="result-stat"><span>错题</span><strong>${data.wrong}</strong></div>
              <div class="result-stat"><span>用时</span><strong>${minutes}:${seconds}</strong></div>
            </div>
            <div class="result-actions">
              <div class="result-actions-row">
                <button class="secondary-btn" data-action="review-wrong">查看错题</button>
                <button class="secondary-btn" data-action="review-bookmark">查看收藏</button>
              </div>
              <button class="primary-btn" data-action="${state.submitted ? "close-modal" : "close-modal"}">${state.submitted ? "继续复盘" : "返回答题"}</button>
              <button class="soft-btn danger" data-action="reset-paper">${icon("rotate", "icon-sm")}重做本卷</button>
            </div>
          </div>
        </div>
      `;
      modal.classList.remove("hidden");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      $("#resultModal").classList.add("hidden");
      document.body.style.overflow = "";
    }

    function reviewFilter(filter) {
      state.filter = filter;
      const visible = visibleQuestions();
      closeModal();
      renderSidebar();
      if (visible.length) {
        jumpTo(visible[0].id);
        showToast(filter === "wrong" ? "已切换到错题" : "已切换到收藏题目");
      } else {
        showToast(filter === "wrong" ? "当前没有错题" : "当前没有收藏题目");
      }
    }

    function openSidebar() {
      $("#mobileSidebar").innerHTML = buildSidebarHtml();
      $("#mobileBackdrop").classList.remove("hidden");
      $("#mobileSheet").classList.remove("hidden");
      document.body.style.overflow = "hidden";
    }

    function closeSidebar() {
      $("#mobileBackdrop").classList.add("hidden");
      $("#mobileSheet").classList.add("hidden");
      if ($("#resultModal").classList.contains("hidden")) document.body.style.overflow = "";
    }

    function updateTimerView() {
      const chip = $("#timeChip");
      const text = $("#timeText");
      if (!chip || !text) return;
      if (state.mode === "exam" && !state.submitted) {
        const remaining = Math.max(0, EXAM_SECONDS - state.examElapsed);
        text.textContent = formatClock(remaining);
        chip.classList.toggle("running", state.timerRunning);
        chip.title = state.timerRunning ? "模拟考试计时中" : "首次作答后开始计时";
      } else {
        text.textContent = state.submitted ? "已交卷" : "不限时";
        chip.classList.remove("running");
        chip.title = "";
      }
    }

    function formatClock(totalSeconds) {
      const seconds = Math.max(0, Math.floor(totalSeconds));
      return `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
    }

    function tick() {
      if (state.mode !== "exam" || state.submitted || !state.timerRunning) return;
      state.examElapsed += 1;
      save();
      updateTimerView();
      if (state.examElapsed >= EXAM_SECONDS) {
        state.submitted = true;
        state.timerRunning = false;
        state.checked = Object.fromEntries(paperQuestions[state.paper].map((q) => [q.id, true]));
        save();
        renderAll();
        openResult();
        showToast("考试时间到，已自动交卷");
      }
    }

    function showToast(message) {
      const toast = $("#toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    document.addEventListener("click", (event) => {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      const action = target.dataset.action;
      if (action === "paper") switchPaper(target.dataset.paper);
      if (action === "mode") setMode(target.dataset.mode);
      if (action === "order") setOrder(target.dataset.order);
      if (action === "filter") {
        state.filter = target.dataset.filter;
        state.palettePage = 0;
        renderSidebar();
        save();
      }
      if (action === "palette-page") {
        state.palettePage = Math.max(
          Math.min(Number(target.dataset.page) || 0, palettePageCount() - 1),
          0
        );
        renderSidebar();
        save();
      }
      if (action === "jump") jumpTo(target.dataset.id);
      if (action === "option") selectOption(target.dataset.key);
      if (action === "bookmark") toggleBookmark();
      if (action === "prev") go(-1);
      if (action === "next") go(1);
      if (action === "submit-current") submitCurrent();
      if (action === "submit-exam") submitExam();
      if (action === "reset-paper") resetPaper();
      if (action === "open-result") openResult();
      if (action === "close-modal") closeModal();
      if (action === "review-wrong") reviewFilter("wrong");
      if (action === "review-bookmark") reviewFilter("bookmark");
      if (action === "open-sidebar") openSidebar();
      if (action === "close-sidebar") closeSidebar();
    });

    document.addEventListener("input", (event) => {
      if (!event.target.matches(".search-input")) return;
      state.search = event.target.value;
      state.palettePage = 0;
      rerenderAfterSearch(event.target);
    });

    document.addEventListener("keydown", (event) => {
      if (event.target.closest("input, textarea, [contenteditable='true']")) return;
      if (event.key === "Escape") {
        closeModal();
        closeSidebar();
        return;
      }
      if (!$("#resultModal").classList.contains("hidden")) return;
      const question = currentQuestion();
      if (!question) return;
      if (/^[1-6]$/.test(event.key)) {
        const index = Number(event.key) - 1;
        const option = question.options[index];
        if (option) {
          event.preventDefault();
          selectOption(option.key);
        }
      }
      if (event.key === "ArrowLeft") { event.preventDefault(); go(-1); }
      if (event.key === "ArrowRight") { event.preventDefault(); go(1); }
      if (event.key === "Enter") {
        if (question.type === "multiple" && state.mode === "practice" && !isRevealed(question)) submitCurrent();
        else if (isRevealed(question)) go(1);
      }
      if (event.key.toLowerCase() === "b") toggleBookmark();
    });

    $("#resultModal").addEventListener("click", (event) => {
      if (event.target === $("#resultModal")) closeModal();
    });

    renderAll();
    setInterval(tick, 1000);
  </script>
</body>
</html>
